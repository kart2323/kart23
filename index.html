⑦信託
	⑦ 日系競合信託・ロンドン拠点との面談要約

1. 面談の目的

（1）海外拠点の機能・事業戦略の把握

* 先方ロンドン拠点が、どのような機能を持ち、海外事業の中でどのような役割を担っているかの確認
* 従来のリサーチ中心の拠点から、プライベートアセットを中心とした事業拠点へ拡大した経緯の把握
* ロンドンに拠点を置くことの事業上・運用上の価値の確認

（2）海外リサーチ・運用機能の配置に関する情報交換

* 現地にアナリスト、ファンドマネージャー、トレーディング機能を置く意義の確認
* 東京からの出張と現地常駐者による情報収集の差の把握
* 現地採用者と日本からの駐在員の役割分担、人材育成上の課題に関する意見交換

（3）海外販売と商品戦略の把握

* 日本株、円債、グローバル株式・債券、プライベートアセットの海外販売戦略の確認
* 海外ディストリビューション拠点の配置と今後の拡大方針の把握
* 海外投資家が日系運用会社へ求める付加価値の確認

2. ロンドン拠点の拡大

（1）拠点人員の大幅な増加

* 従来20人台だったロンドン拠点を、現在は60人超まで拡大
* 増員した約30人の大半は、プライベートマーケット関連の人員
* 今後も英国で事業を拡大する方針を背景とした、経営・管理体制の強化

（2）リサーチ拠点から事業拠点への転換

* 従来はグローバル株式・クレジット等のリサーチを中心としていた拠点
* 現在はプライベートアセットにおいて、フロントからバックまでの一連の機能を保有
    * 銀行との案件協議
    * プライベートデット・ローンファンドの組成
    * 運用
    * 販売
    * ミドル・バック業務
* 単なる情報収集拠点ではなく、収益を生み出す事業拠点への変化

（3）プライベートアセットを中心とする成長

* 拠点拡大の中心はプライベートデット・ローンファンド事業
* 銀行側にあった7～8人程度の既存チームを受け入れ、その機能を核に周辺業務を拡充
* 新規事業をゼロから構築するのではなく、既存の専門チーム、顧客関係、案件発掘力を引き継いだ拡大

3. ロンドン拠点の人員構成

（1）駐在員と現地採用者の構成

* ロンドン拠点60人超のうち、日本からの駐在員は約8人
* 以前は駐在員が1～2人程度であり、事業拡大に伴って増員
* 拠点全体としては、現地採用者を中心とする人員構成

（2）駐在員の主な役割

* 東京本社とのリエゾン
* 事業企画、経営管理、組織マネジメント
* 日本国内への販売・情報連携
* 数年ごとの交代を前提としても、業務の継続性を確保できる役割への配置

（3）現地採用者の主な役割

* 長期間にわたる顧客・銀行・市場関係者との関係構築
* 案件発掘、組成、運用、販売など、現地ビジネスの中核機能
* 特にプライベートアセットでは、長年の人間関係が案件獲得に直結するため、現地採用者を中心とする運営

4. パブリックアセットのリサーチ機能

（1）グローバル株式リサーチ

* ロンドンにグローバル株式アナリスト3人を配置
* 3人はいずれも現地採用者
    * 従来駐在員だったポストの一部も、現地採用へ切り替え
* 東京のグローバル株式運用チームに対するリサーチ提供

（2）クレジットリサーチ機能

* 過去にはロンドンにクレジットアナリストを1人配置
* 現在はロンドンに独立したクレジットアナリスト機能は存在せず
* パブリッククレジットより、プライベートクレジットへ人員と機能を重点配分

（3）ロンドンでの運用機能の変遷

* 過去にはロンドンでグローバル債券ポートフォリオを運用していた時期の存在
* 約10年前に当該運用機能を終了し、その後はリサーチ中心の拠点へ移行
* 現在はプライベートアセットを中心に、再び運用・事業機能を拡大

5. 国内外の人員規模

（1）東京と海外拠点の人員

* 東京本社：約800人
* 海外拠点合計：約120人との説明
    * 会話中には概数に若干の揺れあり
* ロンドンの約60人が海外人員の相当部分を占める構造

（2）その他の海外拠点

* シンガポール：約30人規模との説明
* シンガポールでもプライベートマーケット関連チームを拡大
* ニューヨーク、香港などにも拠点を保有

（3）海外人員の重点分野

* 海外拠点における人員増加の中心はプライベートマーケット
* パブリックアセットのリサーチ機能は維持する一方、大幅な人員増加の対象ではない状況
* 投下される人員・資本の規模からみて、プライベートアセットを海外戦略の最優先領域とする姿勢

6. プライベートアセットの競争力

（1）グループのオリジネーション力

* グループ銀行が持つ、プライベートデット・ローン案件の発掘力を活用
* 一部のオリジネーション分野では、欧州のリーグテーブルで上位5位以内に入るとの説明
* ゼロから案件ネットワークを構築するのではなく、銀行グループの既存基盤を活用できる点が強み

（2）組成・販売・運用の好循環

* グループのオリジネーション力を利用して案件をファンド化
* 海外投資家への販売力を高めることで、案件組成時の資金提供能力とバイイングパワーを向上
* バイイングパワーの向上が、さらに良質な案件の獲得とグループのプレゼンス向上につながる循環

（3）既存チーム・実績の承継

* 過去に外部グループ等から受け入れた専門チームの知識・人脈・実績を活用
* 20年程度にわたり構築された関係性やノウハウの承継
* 新規参入では再現しにくい、長期的な案件発掘力と顧客基盤

7. プライベートアセットファンドの投資家構成

（1）第1号ファンド

* グループ内で先行して設定された第1号ファンド
* 投資家は全員海外投資家との説明
* 当初から国内販売に依存しないグローバルな商品設計

（2）後続ファンド

* 運用会社への機能移管後、既存チームが第2号ファンドを準備
* 想定販売先は海外投資家が過半
* 国内投資家も一部販売対象とする方針

（3）事業のグローバル性

* 日本国内の資金を海外案件へ投資するだけでなく、海外で組成し、海外投資家へ販売する事業モデル
* 運用・販売・案件発掘を現地で完結させる体制
* 日本の運用会社の海外部門というより、グローバルなプライベートマーケット事業としての運営

8. 海外販売体制

（1）日本株販売を中心とした営業網の整備

* 過去約5年間、日本株を海外で販売する営業体制を拡充
* まず販売可能性の高い日本株を軸に、海外顧客との接点を構築
* 日本株販売のための基本的な営業体制整備は、おおむね一段落したとの説明

（2）海外ディストリビューターの配置

* UK、フランス、香港に海外販売担当者を配置
* 今年2月にフランクフルトへ新たな営業拠点を開設
* シンガポールとニューヨークにもオフィスはあるものの、専任の販売担当者は不在

（3）グローバル商品の販売

* 日本株・円債など、日系運用会社として説明しやすく販売確度の高い商品を優先
* グローバル株式・グローバル債券の海外販売は、将来的な選択肢
* 現時点では、海外の顧客に対して「なぜ日本の運用会社へグローバル資産を委託するのか」という説明が難しい状況

9. 海外運用機能の今後

（1）海外でのパブリック運用に対する経営上の関心

* 経営トップには、海外でも運用機能を構築すべきとの問題意識
* 海外営業体制の整備後、次の段階として海外運用機能を検討する可能性
* プライベートアセット以外の海外運用を否定しているわけではないとの説明

（2）外部チームの取り込み

* 海外で運用組織を一から構築する場合、基本的にはまず東京で行うとの考え方
* 一方、海外の既存運用チームを取り込む機会があるかを探索
* 現時点では具体的な案件がある段階ではなく、可能性を調査している状況

（3）シード投資の拡大

* 本社の資本増加に伴い、シード投資へ振り向けられる余力が拡大
* 新しい運用戦略を少額で立ち上げるパイロット案件を増やす方針
* 対象を海外に限定せず、基本的には東京から新戦略を立ち上げる考え方

10. 現地リサーチの付加価値

（1）レポートだけでは得にくい情報

* 東京でセルサイドのレポートを読むことで、基本的なマクロ分析や市場分析は可能との認識
* 一方、対面での面談では、レポートに書かれない確信度、温度感、優先順位を把握可能
* 市場に十分織り込まれているテーマと、まだ投資機会が残るテーマに対する話者の反応の違い

（2）現地における共通認識の把握

* 文面には明示されない、市場参加者間の暗黙の共通理解の把握
* 質問への回答の強弱、議論が盛り上がる論点、慎重になる論点から得られる情報
* 「東京にいてもすべての情報を得られる」という見方に対する反証となり得る現地情報

（3）商慣行への理解

* 現地で長期間業務を行うことによる、欧州の商慣行、投資家行動、コンサルタントの役割への理解
* 日本では銀行・信託グループ内で営業から運用まで完結しやすい一方、海外では役割分担がより明確との当方認識
* 海外で得た商慣行の知識が、将来の日本市場の変化にも活用できる可能性

11. 海外拠点からの出張・企業アクセス

（1）カンファレンスへの参加機会

* ロンドン拠点のアナリストは、欧州各地のカンファレンスへ比較的容易に参加
* 米国で開催されるカンファレンスや企業面談にも頻繁に出張
* 東京から欧米へ出張する場合と比較して、時間・費用・社内承認のハードルが大幅に低い点

（2）東京からの出張との違い

* 東京のシニアアナリストやエコノミストでも、欧州訪問は年1回、1週間程度となるケース
* 東京のグローバル株式担当者に対する長期出張機会は年1人程度
* 海外拠点のアナリストは、カンファレンスや企業取材により高い頻度で参加可能

（3）海外にリサーチ人員を置く合理性

* 現地情報へのアクセス、出張効率、企業との関係構築を根拠として社内説明がしやすい機能
* 2～3人程度の現地リサーチ人員を置くことには、比較的明確な業務上の合理性
* ファンドマネージャーやトレーダーの配置と比較して、規制・コスト面の障壁が低い点

12. 海外への運用・トレーディング機能配置

（1）ファンドマネージャー配置の障壁

* 現地で運用判断を行うための免許・資格・規制対応
* 運用管理、コンプライアンス、オペレーション機能の整備
* 日本と海外に運用機能を分けることに伴う権限・責任の整理

（2）トレーディング機能配置の障壁

* 欧州・米国時間にリアルタイムで取引できる点は海外配置の利点
* 一方、現地トレーダー、システム、管理・決済体制を整備するコスト
* 「東京からでも対応可能」と判断された場合、海外配置の追加コストを正当化することの難しさ

（3）東京からの新発債対応

* 海外クレジットの新発債を東京から深夜勤務で発注する体制
* 過去にはUK拠点へ新発債発注を部分委託していたものの、現在は東京へ戻したとの説明
* 人事・労務面の負担はある一方、現地運用・発注体制を維持するよりコストが低いとの判断

13. 海外人材の育成とキャリア

（1）海外勤務を希望する若手人材

* 留学経験や語学力を持ち、海外勤務を希望する若手運用者・アナリストの増加
* 一方、パブリックアセット運用における海外ポストの限定
* 海外経験後の次の配属先や、複数回の海外経験を提供しにくいキャリア構造

（2）拠点間ローテーションの限界

* 東京、ロンドン、シンガポール、ニューヨーク等の間で、運用人材を定期的に循環させる仕組みは未整備
* 長期出張など、一部の教育機会は存在
* 海外経験後のキャリア選択肢が限られる場合、帰国後に人材が流出する可能性

（3）教育目的の駐在と事業目的の配置の区別

* 海外チームを経験させる教育目的の派遣には一定の意義
* 一方、プライベートアセットなど長期的な現地関係が必要な業務の中核を、数年で交代する駐在員が担うことは困難
* 人材育成と恒常的な現地事業運営を、別の目的として設計する必要性

14. 現地採用者と駐在員の役割分担

（1）長期的な顧客関係を担う現地採用者

* プライベートアセットでは、表面化していない案件を人間関係から獲得する必要性
* 数年ではなく、10年、20年単位で構築される銀行・企業・投資家との関係
* 数年で帰国する駐在員を、案件発掘や顧客関係の中核へ置くことは非合理的との判断

（2）交代可能な機能を担う駐在員

* 東京との連携
* 経営管理・事業企画
* グループ内調整
* 日本国内への販売・情報還元
* 定期的に担当者が交代しても、継続可能な役割への配置

（3）専門性の移転と人材育成

* クレジットアナリスト等が一定期間海外チームを経験し、現地の市場・運用実務を学ぶ派遣は可能
* ただし、派遣者が現地事業の恒常的な中核人材になることまでは想定しない方針
* グローバル人材育成と、現地ビジネスの持続性を両立させる考え方

15. 海外投資家向けの円債ビジネス

（1）円債への関心の変化

* 日本金利の上昇により、海外投資家からみた円債の投資魅力度が以前より改善
* 為替ヘッジ後の利回りや、超長期債の相対価値に対する関心
* 長年ほぼ存在しなかった海外投資家からの問い合わせが、単発的ながら数件出始めた状況

（2）運用委託につなげることの難しさ

* 海外投資家が円債を直接購入できる場合、日系運用会社のアクティブファンドへ委託する必要性が限定的
* 日本だけをグローバル債券ポートフォリオから切り出して委託する需要の少なさ
* ベンチマーク運用だけでは、自家運用との差別化が困難

（3）必要となる付加価値

* イールドカーブ戦略
* 個別銘柄選択
* デリバティブを用いた相対価値戦略
* 海外投資家が自ら実施しにくい運用手法を提供する必要性

16. 海外投資家との面談需要

（1）日本株式に関する面談

* 海外投資家が日本を訪問する際、日本株ファンドマネージャーとの面談を希望するケース
* 商品購入を直ちに目的とするものだけでなく、日本市場・企業に関する情報交換
* 将来の商品選定に備えた、中長期的な関係構築としての面談

（2）円債に関する面談

* 海外投資家から、日本の円債運用者との面談を求められるケースは限定的
* 円債をグローバル債券ポートフォリオの一部として内部で管理する投資家が多い点
* 日本の円債部分だけを日系運用会社へ委託する需要の乏しさ

（3）日本株と円債の違い

* 日本株では企業・市場に関するローカルな知見が差別化要因
* 円債では市場アクセスが比較的容易で、単純なベンチマーク運用の付加価値を説明しにくい点
* 海外販売では、資産クラスごとに異なる価値提案が必要

17. 海外拠点を持つことの営業・マーケティング上の価値

（1）投資家への説明力

* 海外投資家から「なぜ現地に運用・リサーチ人員がいないのか」と質問される可能性
* 現地人員の存在が、情報収集力とグローバルな運用体制を示す加点要素
* 国内投資家に対しても、グローバル運用の信頼性を補強する効果

（2）海外でグローバル商品を販売する難しさ

* 海外投資家からみると、日系運用会社には日本株・円債という明確なブランドイメージ
* グローバル株式・債券を販売する場合、外資系運用会社ではなく日系運用会社を選ぶ理由が必要
* 現地拠点の存在だけでなく、実績、独自性、商品ストーリーの構築が不可欠

（3）コストとの比較

* 現地人員の採用、駐在、オフィス、規制対応にかかる費用
* 運用収益・販売収益で固定費をカバーできるかが最大の制約
* 教育やブランド目的だけでなく、持続可能な事業採算を示す必要性

18. 面談から得られた総合的な示唆

（1）プライベートアセットを軸とする海外戦略

* ロンドン拠点の人員を20人台から60人超へ拡大
* プライベートデット・ローンファンドについて、組成・運用・販売・管理を現地で完結する体制
* フランクフルト営業拠点の新設や、海外投資家中心のファンド組成
* 人員・資本・経営資源の投入から確認できる、海外事業への強い注力

（2）グループの強みを生かした事業モデル

* 一部の分野で欧州トップ5に入るグループ銀行のオリジネーション力
* 運用会社の販売機能を組み合わせることによる資金調達力の向上
* 販売力の向上が案件獲得力を高め、さらに販売可能な商品を増やす好循環

（3）海外リサーチ拠点の有効性

* 現地カンファレンス、企業取材、市場関係者との対話へのアクセス

* 通常、「債券ロング」を意味する場合と「金利上昇方向のポジション」を意味する場合の双方が存在
* ベアフラット化、CTAの金利ショート、超長期債ショートとの整合性から、本要約では「金利上昇方向・債券ショート」と解釈

（2）「一部オープン化」の意味

* 「米金利ポジションを一部だけオープンにする」という意味の可能性
* 「米金利ポジションを一部オプション化する」という記録上の誤りである可能性
* 本要約では、米国金利とドル円の相関を踏まえて重複リスクを調整する趣旨として整理

（3）数値基準の適用範囲

* ストレス時マイナス10％の基準が、個別ポジション・戦略・ファンドのどの単位か
* 月次プラス・マイナス1％のCIO報告が、トレーダー単位かファンド単位か
* マイナス5％での退出が、ポジション解消・戦略停止・運用担当者交代のいずれを意味するか

4. システマティックモデルの開発・導入プロセス

* 研究者による投資仮説、シグナル、リスク管理手法の開発
* システマティック運用は「人間を排除した運用」ではなく、「人間の研究成果をルールとして実装した運用」との整理

（2）モデルの検証プロセス

* 新しいモデルに対する複数段階の審査・検証
* バックテストだけでなく、実装可能性、取引コスト、データ品質などの確認
* 少額の社内資金等によるテスト運用を経た後の本番システムへの昇格

（3）本番運用への反映

* モデルの有効性と実装の安定性が確認された場合にのみ、顧客資産を運用する本番環境へ導入
* 高い確信度と長い実績を持つ戦略への、相対的に大きな配分
* 年金基金等の顧客資産を用いて、検証不十分なモデルを実験することへの否定的な姿勢

5. トレンドフォローの基本的な考え方

（1）価格トレンドに基づく単純なルール

* 個々の市場の価格推移から、上昇トレンドか下落トレンドかを判定
* 上昇トレンドではロング、下落トレンドではショートを構築
* 株式、国債、原油、金、農産物、為替など、先物またはフォワードで取引できる市場への適用

（2）単一市場での限定的な効果

* S&P 500だけでトレンドフォローを行った場合のシャープレシオは、約0.15～0.20との説明
* S&P 500を単純に長期保有した場合のシャープレシオは約0.7との比較
* 単一の資産に適用したトレンドフォローは、それだけでは魅力が限定的との評価

（3）多数市場への適用による改善

* 株式、債券、コモディティ、為替などの多数市場へ同じ考え方を適用
* 各市場のトレンドが同時には発生しないことによる大きな分散効果
* 多数市場を組み合わせることで、全体のシャープレシオが約0.7～0.8まで改善するとの説明

6. トレンドフォローの危機対応特性

（1）転換点の予測ではなく持続する動きへの対応

* 市場の天井や底を正確に予測することは困難との認識
* レジーム転換後の値動きが一定期間継続すれば、モデルが新しいトレンドを認識
* 株式の下落トレンドを確認した場合には、株式ショートへ転換することも可能

（2）伝統的資産の下落局面での収益機会

* 株式や債券に大きな損失が発生する局面で、トレンドフォローが高いリターンを上げる傾向
* 市場環境に応じた以下のようなポジションの構築
    * 株式ショート
    * 債券ロングまたはショート
    * コモディティロング
    * 為替トレンドへの追随
* マルチアセットポートフォリオに対するコンベクシティの提供

（3）裁量的な相場観を必要としない危機対応

* 危機の原因や経済シナリオを事前に正確に予想する必要がない点
* 実際に発生した価格変化を通じて、エクスポージャーを変更する仕組み
* レジーム転換の早期警戒指標と、下落時のヘッジ手段の両面を持つとの評価

7. TargetRiskの戦略的資産配分

（1）長期相関に基づくリスクパリティ

* 株式、債券、クレジット、インフレ関連資産の長期的な相関構造を利用
* 名目金額ではなく、各資産がポートフォリオ全体へ与えるリスクを均等化する考え方
* 伝統的な60％株式・40％債券は、実際のリスクの大部分が株式へ集中しているとの指摘

（2）先方が示した基本的なリスク配分

* 株式：約37.5％
* クレジット：約12.5％
* 債券：約25％
* インフレ関連資産：約25％
    * コモディティ
    * インフレ連動債
    * インフレスワップ

（3）長期相関と短期相関の役割分担

* 戦略的資産配分には、安定性の高い長期相関を使用
* 短期的な相関変化を用いて戦略的配分自体を頻繁に変更することへの慎重な姿勢
* 長期相関が足元で成立していない場合には、別途リスク・オーバーレイを用いて総エクスポージャーを削減

8. デリバティブとレバレッジの活用

（1）分散だけでは低下する絶対リターン

* リスクパリティ化により、ポートフォリオのリスクとシャープレシオは改善
* 一方、低リスク資産への配分増加により、レバレッジを用いない場合には絶対リターンが低下
* 顧客にとってはリスク調整後リターンだけでなく、実際のリターン水準も重要との認識

（2）証拠金効率を活用したリスク調整

* 株式先物、債券先物、商品先物、インフレスワップ、CDSなどのデリバティブを活用
* 現金を全額投じずに幅広い資産へエクスポージャーを持つことによる資本効率の向上
* 分散により改善したシャープレシオを、レバレッジによって絶対リターンへ変換する考え方

（3）レバレッジに伴う相関変化への脆弱性

* 長期相関を前提として名目エクスポージャーを拡大するため、相関構造の崩壊時には損失が増幅する可能性
* 特に株式と債券が同時に下落する局面への警戒
* レバレッジの利用には、迅速なリスク削減機能が不可欠との認識

9. 3種類のアクティブ・リスク管理

（1）ボラティリティ・オーバーレイ

* ポートフォリオ全体に対して、短期と長期のリスク推計値を比較
* 短期ボラティリティが長期ボラティリティを大幅に上回った場合の総エクスポージャー削減
* 使用するデータ
    * 短期・長期の実現ボラティリティ
    * オプション市場から得られるインプライド・ボラティリティ
    * 実際の取引価格から独自に構築したボラティリティ・サーフェス

（2）トレンド・オーバーレイ

* 個々の市場単位での下落トレンドの認識
* 長期的には保有したい資産でも、足元で下落トレンドにある場合のエクスポージャー削減
* JGBとドイツ国債などを別々に判定し、それぞれの市場環境に応じてポジションを調整

（3）相関オーバーレイ

* 株価下落時に債券価格が上昇する通常の分散関係が崩れた局面の検知
* 金利上昇・債券価格下落が株式下落を誘発し、両資産が同時に下落する局面への対応
* 株式・債券相関がプラス方向へ変化した場合の、ポートフォリオ全体のエクスポージャー削減

10. 高頻度データを用いた相関推計

（1）日次データによる相関推計の問題

* 日次データで安定した相関を推計するには、3～5年程度の長い観測期間が必要との説明
* 長い推計期間を使う場合、直近のレジーム変化への反応が遅れる問題
* 短い推計期間を使う場合、観測数不足によって推計値が不安定になる問題

（2）5分足データによる解決

* 1分足または5分足の高頻度データを利用し、短期間で多数の観測値を確保
* 1日から1週間程度でも、日次データの1年分に相当する観測数を得られるとの説明
* 短い時間軸への反応力と統計的な安定性を両立させる考え方

（3）相関オーバーレイへの実装

* 株式と債券の双方が取引されている時間帯の高頻度リターンを利用
* 金利上昇とともに株式・債券相関がプラス方向へ変化した場合の警戒シグナル
* 推計された相関変化に応じて、ポートフォリオ全体のリスク量を迅速に削減

11. 高頻度モデルを実装するための条件

（1）高いリバランス頻度

* 先方戦略では、1日に約10回のリバランスを実施
* 5分足のシグナルを使う場合、日次・週次・月次の意思決定では十分な速度で対応できない可能性
* 高頻度の観測だけでなく、実際にポジションを変更できる運用体制の必要性

（2）裁量型ファンドへの適用上の制約

* 週次・月次で売買判断を行う裁量型ファンドでは、AHLのモデルをそのまま再現することは困難
* 高頻度相関を売買シグナルではなく、リスク警戒指標として利用する可能性
* 最終的な取引判断を人間が行う場合、シグナル発生から意思決定までの遅延を考慮する必要性

（3）執行能力との一体化

* モデルの精度だけでなく、大規模取引を低コストで短時間に実行できる能力が不可欠
* シグナルだけを導入しても、執行体制が伴わなければ同じ運用成果を再現できないとの示唆
* リサーチ、ポートフォリオ構築、発注、約定を一体として設計する必要性

12. 市場急変時のケーススタディ

（1）2018年のVolmageddon

* VIX連動商品の急変に伴う株式市場のボラティリティ上昇
* ボラティリティ、トレンド、相関に関する複数の警戒シグナルの発動
* システムによるエクスポージャー削減と損失抑制

（2）2020年のコロナショック

* コロナショック前から、相関上昇、ボラティリティ上昇、債券市場の悪化を検知
* 株式市場の本格的な下落前に、約3.5倍あった名目エクスポージャーをほぼゼロまで削減
* 大幅なドローダウンを回避した後、市場正常化に合わせて段階的にポジションを再構築

（3）Liberation Day前後の急落と反発

* 関税政策の発表後、市場環境の急激な悪化を受けてシステムがリスクを削減
* 数日後に政策が修正され、市場が急反発したため、同業他社対比では一時的に出遅れ
* 結果的に反発の一部を逃したものの、政策修正がなかった場合の壊滅的な損失を回避する保険として機能

13. リスク削減と再投資のバランス

（1）「速い車には良いブレーキが必要」との考え方

* 平常時にはレバレッジを利用して、分散された幅広い市場へ積極的に投資
* 市場環境が悪化した場合には、複数のオーバーレイを通じて迅速にリスクを削減
* 高いエクスポージャーを持つからこそ、強力なブレーキが不可欠との説明

（2）リスクを戻す能力の重要性

* リスク削減だけに優れていても、市場回復時に再投資できなければ大きな機会損失
* ボラティリティ、トレンド、相関の正常化に応じたポジションの再構築
* リスク削減とリスク再投入の両方を機械的に行うことによる感情的な判断の排除

（3）安定したボラティリティの実現

* 6か月実現ボラティリティを、おおむね10％前後に維持することが目標
* 伝統的な60/40ポートフォリオと同程度のリスク水準で、より高いリターンを目指す設計
* 市場局面によって名目エクスポージャーを大きく変更しながら、ポートフォリオ全体のリスクを安定化

14. パフォーマンス評価とソルティノレシオ

（1）下方リスクを重視した評価

* リターンや通常のボラティリティだけでなく、ソルティノレシオを重要な評価指標として使用
* ソルティノレシオを、リターンをダウンサイド・ボラティリティで割った指標として説明
* 同じリターンでも、下落時の損失が小さい戦略を高く評価する考え方

（2）同業他社との比較

* HFRリスクパリティ指数を含む同業戦略との比較
* 多くの競合戦略のソルティノレシオは約0.3～0.4との説明
* AHLの戦略は、アクティブ・リスク管理により同業内でも高いソルティノレシオを実現しているとの評価

（3）年金基金運用との親和性

* 退職給付に充てる資産では、単純なリターン最大化より大幅損失の回避が重要
* 下落局面での損失抑制と、回復局面での再投資をルール化できる利点
* 年金基金向け運用で説明しやすい、リスク管理の規律と再現性

15. 大規模な取引執行基盤

（1）運用規模と取引量

* 約100億米ドルのファンドで、名目エクスポージャーを3.5倍からほぼゼロへ落とす場合、約350億米ドルの取引が必要
* システマティック部門全体で、年間約10兆米ドルの名目取引を執行
* 執行システムへ年間約2億米ドルを投資しているとの説明

（2）自社執行アルゴリズム

* 取引所へのダイレクト・マーケット・アクセスと自社開発アルゴリズムの利用
* 銀行へ注文執行を全面的に依存せず、Man Group自身が執行方法を決定
* 先物、フォワードなどの大規模取引を、市場から察知されにくい形で実行する仕組み

（3）取引コストの精緻な管理

* 発注時の仲値と実際の約定価格との差である明示的な取引コストの計測
* 自社の注文が市場価格を動かし、次回の取引条件を悪化させる「隠れた市場インパクト」の推計
* 曜日、市場環境、米国市場のオープン時間などを考慮した最適な発注タイミングの選択

16. 債券・OTC市場の電子化

（1）債券取引の自動化

* 従来、人手による執行が中心でコストも高かった債券市場の自動化
* 債券取引の約40～50％を自動化しているとの説明
* 現物債券、クレジット、CDSなどへの電子執行の拡大

（2）銀行からの価格フィードの利用

* JPMorganやGoldman Sachsなどの取引銀行からリアルタイムの価格フィードを取得
* 複数銀行の価格から、自社内で最良買気配・最良売気配を構築
* 銀行は価格データを提供する一方、取引判断・執行ロジックはMan Groupの知的財産

（3）市場データの蓄積

* 電子取引を通じて、従来取得が難しかったOTC市場の高頻度データを蓄積
* 米国市場の開始時刻や特定のイベントが債券価格へ与える影響の分析
* データ蓄積を次世代の執行アルゴリズムへ反映する循環

17. 自動化と人間による監視

（1）完全自動化された基本プロセス

* シグナル生成
* ポートフォリオ構築
* 注文生成
* 市場執行
* 約定・計上
* 執行結果をモデルへ戻すフィードバック
* 一連の基本プロセスは完全に自動化されているとの説明

（2）裁量的な介入を行わない運用哲学

* 市場急変時でも、人間の相場観を理由に個別の取引を取り消さない方針
* システムが設計どおり動いている限り、モデルの判断に従う姿勢
* 危機時には監視頻度を上げるものの、投資判断そのものを人間へ戻さない運用

（3）異常値に対する人間の確認

* 通常1％程度のADVを想定する注文が5％に達するなど、異常な注文へのアラート
* データ、シグナル、ポートフォリオ、執行の各段階での異常検知
* アラート発生時には、研究者またはポートフォリオマネージャーがデータ障害か正当なシグナルかを確認

18. シミュレーションと実運用の整合性

（1）シミュレーション環境と本番環境の並行稼働

* 同じモデルをシミュレーション環境と実運用環境の双方で稼働
* シミュレーション損益と実際の損益の継続的な比較
* 両者が一致しない場合の、モデル、データ、取引コスト、計上処理の調査

（2）本番導入前の厳格な確認

* シミュレーションと実取引が一致することを本番運用の条件として設定
* 実装上の誤りを、運用成果が悪化する前に発見する仕組み
* 理論モデルだけでなく、実際の執行結果まで含めたモデル・ガバナンス

（3）裁量型運用との相違

* 当方では定量モデルを裁量運用の参考情報として使用し、最終判断は人間が実施
* AHLでは研究段階で人間が判断し、本番運用ではモデルが判断
* 売買頻度、執行規模、組織体制の違いを踏まえると、完全自動化の再現には大規模なインフラが必要

19. 過去データから将来を予測できるか

（1）確実な予測ではなく統計的な優位性

* 将来を正確に予測できるという考え方ではなく、過去データから確率的な優位性を抽出する考え方
* 個々の取引では正解・不正解が発生するものの、多数の取引を通じた期待収益の獲得
* 市場には一定の非効率性が残っているとの先方の基本認識

（2）取引コスト控除後のリターンによる検証

* モデルに予測力がなければ、勝率が50％程度となり、取引コスト分だけ損失が積み上がるとの説明
* 長期的に取引コスト控除後のリターンが残っていることを、モデルに情報価値がある根拠として提示
* システマティック運用事業が長期間存続・拡大していることも、一定の予測力の証左との先方の見方

（3）モデルの頑健性を支える要素

* 多数市場への分散
* 複数シグナルの組み合わせ
* 厳格な取引コスト管理
* シミュレーションと実運用の照合
* 個別モデルの予測力だけに依存しない運用設計

（1）コーディング能力から組織知への競争力の移行

* 今後の競争力は、社内に蓄積された独自データ、研究成果、市場知識へ移行

（2）アルファモデルへの応用

（3）安全性と受託者責任の重視

* 年金資産などを運用する受託者として、AIモデルを十分に検証せず導入することへの否定的な姿勢
* 高い確信度を持つモデルだけを、本番環境へ安全に導入するプロセス
* 生産性、研究品質、開発速度を高めながら、モデルリスクを抑える基盤整備の優先

* 長期的な相関を戦略配分に使用し、短期的な相関を警戒指標として使用する方法

5. 日本の政府債務に対する海外投資家の評価

（1）新興国型財政危機との相違

* 日本の政府債務残高対GDP比は世界最高水準である一方、海外投資家はアルゼンチン型の危機を想定していないとの説明
* 日本国債の相当部分をBOJが保有している点
* 新興国でみられるような急激なインフレ、外貨建て債務、対外資金依存の問題が限定的である点

（2）金融引き締めの二面性

* BOJがインフレ対応で後手に回っていると認識される場合、利上げは長期国債市場の安定に寄与
* 一方、政策金利の引き上げは政府の利払い費を増やし、財政負担を強める可能性
* 利上げの評価を左右する要素として、政府が必要な財政調整を実施するとの信認の重要性

（3）財政危機ではなく円への継続的な下落圧力

* 海外投資家は、日本の財政を直ちに危機へ向かうものとはみていないとの評価
* 一方、巨額の政府債務と低い国内利回りは、日本資産を積極的に保有する誘因を弱める要素
* 財政問題は急激なデフォルトリスクではなく、円に対する長期的・継続的な下落圧力として表れやすいとの見方

6. 主要中央銀行のタカ派度の順位

（1）今後予想される引き締め幅に基づく順位

* 第1位：BOJ
* 第2位：ECB
* 第3位：FRBとBOE
    * FRBとBOEについては、ともに市場の織り込みより大幅にハト派的な先方予想
* 全中央銀行について市場予想よりハト派的であり、その中でBOJが相対的に最もタカ派との整理

（2）BOJとECBの政策予想

* BOJについて、今後3回、各25bpの利上げを予想
    * 面談時の予想では、最終的に政策金利1.75％への引き上げ
    * おおむね3～4か月に1回の利上げペース
* ECBについて、追加利上げはあと1回との予想
* BOJにはECBよりもタカ派方向に市場を驚かせる余地が残っているとの評価

（3）FRBとBOEの政策予想

* FRBについて、直近会合で25bp利上げした後は据え置きとの予想
    * 住宅インフレなど基調的なインフレ指標は改善方向
    * 市場が直近利上げを約90％織り込んでいることも、実施理由の一つ
* BOEについて、次回会合は据え置き、その後11月に25bpの利上げを予想
* FRBとBOEはいずれも、その後は翌年7～9月期頃から利下げへ転じるとの見通し

7. FRBの反応関数と情報発信

（1）議長発言から政策を読み取る難しさ

* 直近の記者会見では、議長が明確なフォワードガイダンスや反応関数を示すことに消極的との評価
* ジャクソンホールのような準備された講演では明確なメッセージを出せる一方、質疑応答では明言を避ける傾向
* 議長発言だけから委員会全体の方向性を把握することが、以前より難しくなっているとの見方

（2）委員会内部の意見分散

* パウエル議長時代と比較して、委員会内部の見方が分散し、反対票も増えているとの指摘
* ウォラー理事など、個別の委員が示すインフレ評価や利上げ条件の重要性の上昇
* 議長だけでなく、複数の委員の発言を横断的に確認する必要性

（3）ドットチャートと議事要旨の重要性

* SEPの中央値では、年内あと1回の利上げがコンセンサスとの説明
* 前回予測では、6人の参加者が年内2回以上の追加利上げを見込んでいた点
* 次回ドットチャートでは、複数回の利上げを見込む参加者が6人から増えるかが重要との見方

8. 金融政策の織り込み差とクロス円

（1）中央銀行見通しのコンセンサスギャップ

* 先方の予想と市場の政策金利織り込みの間には、依然として相当の乖離が残っているとの判断
* 特にFRBとBOEについて、市場が織り込む翌年末までの引き締め幅は約140～150bp
* 先方は直近の25bp利上げのみを予想しており、市場対比で大幅にハト派的な見通し

（2）クロス円における円高方向のリスク

* BOJはECB、FRB、BOEよりもタカ派方向に市場を驚かせる余地が大きいとの見方
* 植田総裁が高田委員と同様に連続利上げの可能性を示唆した場合、円高が進む可能性
* 金融政策だけを取り出せば、以下の通貨ペアに下落リスク
    * EUR/JPY
    * GBP/JPY
    * USD/JPY

（3）金融政策以外の要因の重要性

* 各中央銀行に対して総じてハト派予想であるため、金利差だけでは通貨の方向を明確に判断しにくいとの説明
* 足元では相対的な金融政策よりも、エネルギー価格による交易条件の変化を重視
* 中央銀行政策は依然重要であるものの、通常よりFX相場への説明力が低下しているとの評価

9. エネルギー価格と交易条件

（1）最も重要なFXドライバーとしてのエネルギー価格

* エネルギー価格を足元の為替市場における最重要テーマとする先方の見方
* エネルギーショックが約半年継続し、欧州天然ガス価格も高値を更新しているとの認識
* エネルギー輸出国通貨買い・輸入国通貨売りの戦略を重視

（2）エネルギー輸出国通貨と輸入国通貨

* エネルギー価格上昇の恩恵を受けやすい通貨
    * ノルウェークローネ
    * 豪ドル
    * 米ドル
    * カナダドル
* エネルギー価格上昇の悪影響を受けやすい通貨
    * ユーロ
    * 英ポンド
    * 円
    * スウェーデンクローナ
    * NZドル

（3）スポット価格より長く続く交易条件効果

* エネルギー価格上昇による貿易収支・所得移転の影響は、エネルギー価格そのものの上昇より長期間継続するとの説明
* NOK/SEKでは、原油価格がピークアウトした後もノルウェークローネ高が維持された事例
* エネルギー価格が再上昇した局面では、通貨ペアが原油価格以上に大きく動く可能性

10. 円を取り巻くファンダメンタルズと政策の対立

（1）円に不利なマクロ環境

* エネルギー輸入による交易条件の悪化
* 日本の財政に対する懸念
* 世界的な高金利環境
* リスク選好の強い市場環境における低金利通貨としての円売り圧力

（2）円高を目指す政策との緊張関係

* 日本当局が、従来より強い意思と信認を伴って円高方向への政策を進めているとの評価
* BOJ利上げ、為替介入、国内資産への資金回帰促進による円高圧力
* 円に不利なマクロ要因と、円高を目指す政策要因が拮抗する構造

（3）短期的なドル円上昇リスク

* 国内回帰や投資家の資産配分変更には時間を要する一方、エネルギー価格上昇は即時に日本の交易条件へ影響
* 政策期待が先行し、実際の資金回帰が遅れた場合の失望リスク
* 数週間程度の短期では、ドル円が再び上昇する可能性への警戒

11. EUR/CHFとSNBの政策

（1）2022年のエネルギーショックとの相違

* 2022年はスイスのインフレ率が3％を超え、SNBがスイスフラン高を通じて輸入インフレを抑制
* 今回はインフレ率が上昇しているものの、依然として1％未満
* SNBの物価安定レンジである0～2％の範囲内にあるため、フラン安を容認しているとの評価

（2）為替介入の可能性

* 先方の介入推計では、今回のエネルギーショック下でのSNB介入は極めて小規模
* 現時点では、ユーロ高・スイスフラン安がさらに進む余地があるとの見方
* スイスのインフレ率が1.5～2％へ上昇すれば、SNBがフラン安への懸念を示し、為替介入を再開する可能性

（3）EUR/CHFの投資判断

* ヘッジファンドによる、キャリーとモメンタムを目的としたEUR/CHFロングへの強い関心
* SNBのスタンスが変わるまで、EUR/CHF上昇の流れが短期的に続くとの予想
* インフレ上昇とSNBの発言変化が、ポジションを反転させる主要なトリガー

12. キャリートレードの調達通貨

（1）円から他通貨への移行

* BOJ利上げと当局の円高政策により、円を調達通貨として使用することへの警戒感の上昇
* 円に代わる調達通貨として、スイスフランが最も明確な候補との評価
* ユーロ、カナダドル、スウェーデンクローナ、人民元なども選択肢として挙げられた点

（2）既に進行した円ショートの縮小

* 7～8月の為替介入局面で、投機筋の円ショートポジションが急速に縮小
* ポジション統計上、円から他の調達通貨への移行は相当程度既に進んだとの分析
* 政策リスクを考慮すると、投資家が再び大規模な円ショートを構築する可能性は限定的との見方

（3）キャリートレード全体の混雑度

* キャリートレードは当年比較的良好なパフォーマンスを上げているとの説明
* ただし、2024年の大規模な円キャリー取引ほどポジションは積み上がっていないとの評価
* 将来の大規模な巻き戻しリスクは、2024年当時より小さいとの判断

13. 先方が挙げた主な為替戦略

（1）エネルギー価格を軸とした通貨戦略

* EUR/AUDの売り
    * エネルギー輸入地域である欧州と、資源輸出国である豪州の交易条件格差
    * エネルギー価格が急落した場合は投資前提が変化
* NOKなど、エネルギー輸出国通貨への前向きな評価
* G10通貨でも、従来以上にキャリーを重視する必要性

（2）米ドル買いを軸とした戦略

* USD/CADの買い
    * 米国の対カナダ関税をめぐる圧力
    * 市場が関税リスクを過度に軽視している可能性
    * 短期的な戦略としての位置付け
* USD/SEKの買い
    * エネルギー輸入国通貨であるスウェーデンクローナへの慎重な見方
* EUR/USDの売り
    * エネルギー交易条件と欧米経済の相対差を背景とするドル選好

（3）スイスフラン売りを軸とした戦略

* EUR/CHFの買いに加え、USD/CHFの買いも選好
* 先方がEUR/USDにも弱気であることから、USD/CHFの方が一貫したポジションとの説明
* 主なリスクとして以下への言及
    * スイスのインフレ上昇とSNBの介入
    * 金価格上昇に伴うスイスフラン高
    * リスク回避局面におけるフランの安全通貨需要

14. ドル円の想定レンジとポジショニング

（1）年内のドル円レンジ

* 年内は比較的狭いレンジで推移するとの予想
* 中心的なレンジとして1ドル＝150～155円程度への言及
* 150円を下回る可能性を否定しない一方、短期的には上方向のリスクがより大きいとの評価

（2）短期と中期で異なる見通し

* 短期
    * エネルギー高、財政懸念、高い世界金利により、ドル円上昇リスク
    * 日本への資金回帰が実際に進むまでに時間を要する可能性
* 翌年末
    * BOJ利上げ、資産配分の国内回帰、政策対応が進めば、135円程度までの円高も想定可能
* 短期の円安ファンダメンタルズと中期の円高政策の時間軸の相違

（3）為替介入の水準感

* 現在の水準では、日本当局が直ちに介入する必要性は高くないとの見方
* ドル円が157～158円付近へ再上昇した場合、介入の可能性が高まるとの推測
* ドル円自体が、日本当局の政策反応関数の一部になっているとの評価

（4）投資家ポジションの状況

* ヘッジファンドの円ショートは、ほぼ全面的に解消済みとの分析
* 実需・長期投資家には、なお一部ドルロングが残存
* 足元のドル円変動には、新規の大規模な円ショートよりも、短期的・投機的な取引が影響している可能性

15. 日本企業の海外投資と円相場

（1）海外収益を日本へ戻さない構造

* 日本の中小企業を含む企業が、ベトナムなど成長性の高い海外市場へ投資する動き
* 海外事業から得た収益を日本へ還流せず、現地で再投資する傾向
* 1980～1990年代と比較して、経常黒字が機械的に円買いへ結び付かない構造

（2）国内投資機会の不足

* 持続的な円高には、日本企業が国内へ資金を戻して投資する誘因の必要性
* 現時点では、円高につながる明確な国内投資回帰が十分に確認されていないとの問題意識
* 政府による国内投資環境と期待成長率の改善の重要性

（3）円高による企業行動変化の可能性

* 過去数年は円安によって海外投資の円換算リターンが押し上げられた点
* 円高へ転換すれば、非ヘッジの海外投資の魅力が低下する可能性
* 円相場自体の変化が、企業の海外投資・国内回帰行動を変える可能性

16. ユーロの国際通貨化

（1）ユーロの国際的役割を拡大する議論

* ECBなどから「今こそグローバル・ユーロを推進すべき」とする発言が増えている点
* ドル建てステーブルコインの拡大に対抗するため、デジタルユーロを検討する動き
* 一方、ユーロ建て取引や資産発行の世界シェアは依然として低いとの評価

（2）ドルに対抗することの難しさ

* 国際決済、資金調達、金融市場におけるドルシステムの強い定着
* ユーロがドルへ対抗するために必要な条件
    * 欧州のより高い経済成長
    * 深く統合された資本市場
    * 安定した政策運営
    * 欧州域内の経済・防衛面の結び付き強化
* 数年ではなく、数十年単位の取り組みが必要との先方の見方

（3）具体的な政策手段の不足

* ドラギ報告など、資本市場の深化や生産性向上に向けた改革は一定の前進
* ただし、ユーロの国際利用を急速に増加させる即効性のある政策は見当たらないとの評価
* 世界で利用されるユーロ建てステーブルコインより、域内向けのデジタルユーロを優先している点も制約

17. ドル離れと準備資産の分散

（1）マルチアセット投資家のドルエクスポージャー削減

* 米国資産のボラティリティ上昇を背景とした、非ヘッジのドルエクスポージャー削減
* 2025年にはドルの安全通貨性が弱まり、リスク資産と同方向に動く局面が増えたとの指摘
* ドル依存を下げたいという分散ニーズの高まり

（2）ユーロではなく金への資金移動

* 新興国中央銀行を中心に、ドル資産から金への分散が進行
* ユーロは通貨バスケットの一部にはなるものの、明確な第一の受け皿にはなっていないとの分析
* 米財務省がドルに代わる存在として警戒すべきものは、現時点ではユーロより金や人民元との見方

（3）中国の準備資産運用

* 中国人民銀行による、米国債・ドル資産から金への分散
* 人民元の国際化と通貨高を促したい政策意図
* 巨額の経常黒字を維持しながら人民元高を実現することの政策的な難しさ
* 中国についても、ドル資産削減の主な受け皿はユーロより金との評価

18. 面談から得られた総合的な示唆

（1）米ドルに関する見方

* ドルの基軸通貨としての地位は維持される一方、米国債市場安定化策に伴う一時的なドル安リスク
* 継続的なドル安政策ではなく、政策イベントごとにドルが調整弁となる可能性
* エネルギー輸出国としての交易条件面では、米ドルは相対的に有利との評価

（2）円に関する見方

* エネルギー、財政、世界的な高金利というマクロ要因は円に不利
* BOJ利上げ、為替介入、日米当局の姿勢は円に有利
* 短期的にはドル円上昇リスクが残る一方、中期的には大幅な円高の可能性
* マクロと政策が反対方向に作用するため、レンジ相場になりやすいとの評価

（3）ユーロ・スイスフランに関する見方

* ユーロはエネルギー輸入による交易条件悪化の影響を受けやすい通貨
* ユーロがドルからの準備資産分散の主要な受け皿となる可能性は当面限定的
* スイスのインフレが低い間はSNBがフラン安を容認し、EUR/CHFやUSD/CHFの上昇余地
* スイスのインフレ上昇とSNBの姿勢変化が重要な反転リスク

（4）為替配分における主要な判断軸

* 相対的な中央銀行政策よりも、エネルギー価格と交易条件を重視
* 政策予想だけでなく、財政、国債市場、経常収支、実際の資金フローを合わせた評価の必要性
* 金利差、キャリー、エネルギー、政策リスクを組み合わせた通貨ペア選択の重要性

	③ 欧州株式ストラテジストとの面談要約・完全版

1. 面談の目的

（1）日本の投資家から見た欧州株式の投資意義の確認

* 低成長とみられやすい欧州へ投資する意義と、米国株式・日本株式に対する分散効果の確認
* 欧州経済の成長率だけでは捉えられない、欧州上場企業の収益構造と成長要因の把握
* 面談内容を東京のグローバル株式チームや投資委員会へ共有することを想定した情報収集

（2）国・セクター・指数別の投資機会の確認

* 既存の汎欧州株式投資に加え、国別・セクター別に配分を拡大する余地の検討
* DAX 40、EURO STOXX 50、STOXX Europe 600などの指数特性の把握
* ドイツ、イタリア、スペインなどの投資魅力度と、それを左右するセクター構成の確認

2. 欧州株式市場と欧州経済の相違

（1）実体経済とは異なる株式市場のセクター構成

* 「欧州株式市場は欧州経済そのものではない」との先方の基本認識
    * 欧州経済に占める政府部門や伝統的産業の比率は、上場株式市場の時価総額構成と必ずしも一致せず
    * 経済全体で大きな産業であっても、株式指数に占める割合が小さい場合の存在
* 「欧州にはテクノロジー企業がない」とみられがちである一方、テクノロジー関連は欧州株指数の約15％を占めるとの説明
* 欧州の低いGDP成長率だけを理由に、欧州株式の成長性も低いと判断することへの否定的な見方

（2）欧州域外への大きな売上エクスポージャー

* STOXX Europe 600、EURO STOXX 50、MSCI Europeなどの構成企業によるグローバルな収益構造
    * 欧州域内から得る売上高は全体の半分未満
    * ユーロ圏から得る売上高はおおむね3分の1程度
* 残りの売上高は米国や新興国など、相対的に成長率の高い地域から獲得
* 欧州各国の景気、政治、財政だけでは、欧州企業の業績を十分に説明できないとの先方のスタンス

3. 欧州株式のパフォーマンスと分散効果

（1）米国株式と比較して遜色のないパフォーマンス

* 年初来のSTOXX Europe 600の上昇率は約13％で、S&P 500とおおむね同水準との説明
* 2025年初以降でみれば、欧州株式が米国株式を上回っているとの評価
* 欧州経済の低成長と欧州株式の低リターンを直接結び付ける見方への否定

（2）銘柄間で比較的広がりのある上昇

* 欧州株式の中央値でみた上昇率も約10％で、指数全体の上昇率との乖離が小さい点
* 一部の大型テクノロジー株に上昇が集中する米国株式との相違
* 韓国・台湾の一部銘柄に牽引されるアジア株式との比較
    * アジア株指数が大幅に上昇する一方、中央値の上昇率は約2％にとどまるとの説明

（3）グローバル投資家の低い保有比率

* 2022年のロシアによるウクライナ侵攻以降、欧州株式から継続した資金流出
* 2025年以降は資金流入へ転じているものの、累積では侵攻前の水準に戻った程度との分析
* 米国株式やアジア株式と比較すると、グローバル投資家は依然として欧州株式を十分に保有していないとの見方

4. AI投資・設備投資サイクルによる恩恵

（1）AI関連設備投資の間接的な受益

* AIブームの中心は米国である一方、欧州企業も設備投資を通じて恩恵を受けるとの評価
    * 半導体製造装置
    * 電力設備・送配電網
    * 資本財・産業機械
    * データセンター関連設備
    * 建設資材
* ASMLなどの直接的なAI関連企業だけでなく、電力需要や設備投資を支える企業への波及
* ハイパースケーラーの設備投資について、先方資料では翌年に1兆ドル程度、前年比約40％増に達する可能性への言及

（2）資本集約型産業に有利な市場環境への転換

* 世界金融危機後の低金利環境では、資本を多く必要としない米国のテクノロジー企業が優位だったとの整理
* 現在はAI、電化、防衛、サプライチェーンの地域化など、実物設備への投資を必要とする成長テーマへの転換
* 資本財、公益、産業関連企業の多い欧州にとって、以前より有利な投資環境との評価

（3）設備投資関連企業の業績改善

* 欧州の資本財・公益企業における受注、価格決定力、利益予想の改善
* 電化、データセンター、EV、エネルギー供給制約に関連する投資需要の継続
* 欧州株式の近年のパフォーマンスを、資本集約度の高い企業の再評価が相当程度説明しているとの分析

5. 厳しいマクロ環境と堅調な企業業績

（1）欧州株式を取り巻く主要なマクロリスク

* エネルギー価格の高止まりと中東情勢の長期化
* 長期金利および政策金利の上昇
* 個人消費の減速
* フランス、ドイツ、イタリアなどの政治的不確実性
* 中国との競争激化および中国需要の低迷

（2）エネルギー価格・金利と株価バリュエーションの乖離

* 従来は天然ガス、原油、金利の上昇と欧州株式のPER低下に強い関係がみられたとの説明
* 夏以降はこの関係が弱まり、エネルギー価格と金利の上昇に対して株式市場の反応が限定的となった点
* 中東情勢の長期化、エネルギー在庫の低下、エネルギーインフラへの波及などを踏まえ、インフレリスクを軽視できないとの警戒感

（3）マクロ環境に反して強いミクロ面

* 先方による「challenging macro, strong micro」との整理
* 2026年の欧州企業のEPS成長予想が、年初来で約6.4％上方修正されたとの説明
* マクロ経済の不透明感が強い一方、企業利益予想は下方修正ではなく上方修正されている点を重視する姿勢

6. エネルギー高によるセクター別の影響

（1）エネルギー高の恩恵を受けるセクター

* 原油・天然ガス価格上昇によるエネルギー企業の利益予想の大幅な上方修正
* 資源価格上昇の恩恵を受ける鉱業・素材企業
* 金利上昇による利ざや改善が期待できる金融株
    * 景気後退に至らないことが前提
    * 配当と自社株買いを合わせた8～9％程度の株主還元も魅力との評価

（2）公益・化学・産業株への波及

* 電力価格上昇と構造的な電化需要の恩恵を受ける公益株
    * 再生可能エネルギー事業者も、電力市場価格上昇の恩恵を享受できるとの見方
* 今回のエネルギー高は2022年と異なり、欧州に限定されず世界全体に影響するショックとの整理
    * 欧州の化学企業だけが競争上不利になる構造ではなく、コスト転嫁もしやすいとの評価
* AI、データセンター、防衛関連投資の増加による産業株への二次的な恩恵

（3）相対的に慎重なセクター

* 自動車、旅行・レジャー、ラグジュアリーなどの消費関連企業
* 金利上昇の直接的な影響を受ける不動産
* エネルギーそのものには中立を維持しつつ、金融・公益など二次的な受益セクターを選好する方針

7. 欧州の個人消費と政治的不確実性

（1）個人消費に対する慎重な見方

* 欧州、米国、中国のいずれについても、消費関連セクターに慎重な先方のスタンス
* 金利と商品価格の上昇、実質賃金の伸び悩み、政策支援の反動による消費減速の可能性
* 上場企業は高所得者層向けの事業が多いものの、消費全体の弱さを無視できないとの判断

（2）K字型消費構造の継続

* 高所得者層が比較的堅調である一方、低所得者層の消費余力が低下する構造
* ラグジュアリー企業などは高所得者層へのエクスポージャーを持つものの、セクター全体としては慎重な評価
* 消費関連株を欧州株式市場の中で相対的に弱い部分とみる見方

（3）選挙と財政再建に対する警戒

* 翌年の欧州で多数の選挙が予定される中、増税や歳出削減に対する不確実性の高まり
* 財政赤字と高金利を背景に、家計が将来の負担増加を警戒して支出を抑える可能性
* 政治的不透明感が消費者・企業のセンチメントを抑制するとの見方

8. 中国に関連するリスク

（1）中国需要の低迷と中国企業との競争激化

* 中国の消費低迷による、欧州企業の中国向け売上への悪影響
* 中国国内、欧州市場、第三国市場のそれぞれにおける中国企業との競争激化
* 自動車、化学を中心に、一部の産業財へも競争圧力が広がる可能性

（2）貿易摩擦と経済安全保障上の対立

* 大規模な関税措置に至らない場合でも、調査や個別規制を通じた摩擦が継続する可能性
* 欧州と中国の双方で、産業保護やサプライチェーン再編が進むとの見方
* 中国関連エクスポージャーの大きい企業に対する慎重姿勢

（3）欧州株指数全体への影響の限定性

* 自動車産業は欧州経済と雇用にとって重要である一方、欧州株式市場の時価総額では約2％との説明
* 自動車株の構成比低下により、中国との競争激化が指数全体へ与える影響は以前より小さいとの評価
* 中国企業が輸出数量や市場シェアを伸ばしても、低価格・低利益率・低ROEであれば中国株のリターンには直結しないとの指摘

9. 国別投資とドイツ株式への評価

（1）国別指数をセクター配分として捉える考え方

* イタリア株式を金融株へのエクスポージャーとして捉える整理
* スペイン株式を公益株へのエクスポージャーとして捉える整理
* ドイツ株式を資本財・産業株・設備投資サイクルへのエクスポージャーとして捉える整理

（2）ドイツ株式に対する見方の引き上げ

* 先方が直近でドイツ株式に対する見方をより前向きに変更したとの説明
* 自動車・化学のドイツ株式市場に占める比率が、約10年前の約35％から約10％まで低下したとの指摘
* 現在のDAXは、AI設備投資、資本財、銀行、防衛、財政拡張など、先方が選好するテーマへのエクスポージャーが拡大

（3）財政拡張の実体経済への波及

* ドイツ政府による約5,000億ユーロ規模の中長期的なインフラ・防衛投資への言及
* 当初は執行の遅さが懸念されたものの、直近のGDP統計では政府支出が上振れに寄与したとの分析
* 政府支出が実際に経済と企業業績へ波及し始めている可能性を評価する姿勢

（4）業績成長とバリュエーションの組み合わせ

* ドイツ企業の翌年利益成長率は約17％と予想され、米国の約12％を上回るとの説明
* ドイツ株式は米国株式に対して約25％のディスカウントで取引されているとの分析
* 「米国並みの利益成長を、欧州型の割安なバリュエーションで購入できる」との投資評価

（5）政治・地政学リスクに対する先方の判断

* ドイツ東部の一部地域で極右政党への支持が高まっている点はリスクと認識
* 一方、全国レベルでは限定的であり、連立政権が近い将来に崩壊する可能性は低いとのベースケース
* ロシア・ウクライナ戦争のリスクは、2022年以降の大規模な資金流出を通じて相当程度市場へ織り込まれたとの見方

10. ECB・インフレ・金利見通し

（1）市場対比でハト派的な金融政策見通し

* ECBとFRBの双方について、市場の織り込みよりもハト派的な先方の見通し
* 最近の金利上昇は、基調的なインフレだけでなく、エネルギー価格、財政不安、タームプレミアムの上昇が主因との分析
* 直近会合での追加利上げを予想する一方、中期的には市場が織り込む利上げ回数が過大との判断

（2）インフレの二次的波及に対する見方

* 2022年当時とは異なり、企業が広範な値上げを行う動きは確認されていないとの説明
* エネルギー価格上昇が、賃金やコアインフレへ大きく波及する兆候は現時点で限定的との評価
* 失業率は低いものの、労働市場の過熱や強い賃金上昇圧力はみられないとの判断

（3）インフレ率の低下予想

* 欧州と米国のインフレ率が、おおむね1年程度で目標水準へ近づくとの予想
* 特に2027年上期にかけて、コアインフレ率が比較的速いペースで低下するとの見通し
* 中東情勢とエネルギー価格が最大の上振れリスクであるとの認識

（4）エネルギー価格上昇の感応度

* エネルギー価格が10％上昇した場合の先方試算
    * GDP成長率への影響：約マイナス0.1％ポイント
    * コアインフレ率への影響：約プラス0.1％ポイント
    * ヘッドラインインフレ率への影響：約プラス0.3％ポイント
* ヘッドラインインフレへの影響に比べ、コアインフレへの波及は小さいとの評価

11. イールドカーブのスティープ化と株式市場【今回の追記】

（1）スティープ化の原因を重視する考え方

* イールドカーブの傾きは株式市場に影響するものの、安定した関係を見つけることは非常に困難との説明
* 2年・10年金利差の変化だけをみて、株式市場や個別セクターの方向を判断することへの否定的な見方
* ブル・スティープ化かベア・スティープ化かに加え、その背景にある景気、インフレ、金融政策、財政懸念の識別の必要性

（2）景気改善を背景とするスティープ化

* 景気回復や成長期待の改善によるスティープ化は、株式市場が比較的消化しやすいとの評価
* 成長改善と長短金利差拡大の組み合わせは、特に金融株にとって追い風となる可能性
* 単なる金利上昇ではなく、企業利益を伴う成長によってカーブが動いているかを重視する姿勢

（3）財政不安を背景とするスティープ化

* 財政赤字や国債供給への懸念から長期金利が上昇するスティープ化は、景気改善型とは全く異なるとの説明
* 財政プレミアムの上昇は、株式のバリュエーションや資金調達コストに悪影響を与える可能性
* 同じカーブのスティープ化でも、背景によって株式市場への影響が正反対になり得るとの指摘

（4）セクター配分への実務的な含意

* イールドカーブとセクター別株価の相関は、期間や局面によって大きく変化するとの分析
* 最終的に重視すべき要素として、以下への言及
    * 経済成長率の方向
    * 市場と企業がインフレを吸収できるか
    * 企業がコスト上昇を販売価格へ転嫁できるか
    * 金利上昇が景気改善によるものか財政懸念によるものか
* イールドカーブの形状だけを根拠に株式ポジションを構築することは「非常に難しい」との先方の結論

12. 面談から得られた総合的な示唆

（1）欧州株式への前向きな基本姿勢

* 欧州株式を低成長の欧州経済の代理変数として評価することへの否定
* グローバル売上、幅広い利益成長、資本集約型産業へのエクスポージャー、割安なバリュエーションの評価
* 米国株式やAI大型株への集中を緩和する分散投資先としての有効性

（2）推奨する投資テーマ

* AI・データセンター・電化に関連する資本財および産業株
* 金利上昇と株主還元の恩恵を受ける金融株
* 電力需要増加と構造的な設備投資の恩恵を受ける公益株
* 財政拡張と利益成長が期待されるドイツ株式

（3）主要な下振れリスク

* 中東情勢の長期化とエネルギー価格の一段の上昇
* 財政懸念を伴う長期金利上昇と株式バリュエーションの調整
* 個人消費の減速
* 欧州各国の選挙と財政再建
* 中国需要の低迷と中国企業との競争激化

	Dear [Name],

Thank you very much for taking the time to meet with us in London.

Please accept my apologies for the delayed follow-up. We have only just returned to the office following the public holiday period in Japan.

I greatly appreciated your detailed explanation of the investment case for European equities. Your point that the European equity market should not be viewed simply as a reflection of the European economy was particularly helpful. The global revenue exposure of European companies, together with the relatively broad-based earnings growth across the market, gave us a useful perspective on Europe’s role as a source of portfolio diversification.

I also found your explanation of Europe’s exposure to the global capital expenditure cycle very insightful. In particular, the potential benefits from AI-related investment, electrification, data centres, defence spending and other capital-intensive projects are highly relevant to our assessment of European equities.

Your increasingly constructive view on Germany was also very interesting. The combination of fiscal expansion, improving earnings expectations and a significant valuation discount to the US provides a compelling framework for considering German equities.

I also appreciated your explanation that yield-curve steepening should not be interpreted mechanically as an equity signal. Your distinction between steepening driven by stronger growth and steepening driven by fiscal concerns was particularly useful. It reinforced the importance of examining the underlying drivers of interest-rate moves, as well as corporate pricing power and the market’s ability to absorb inflation.

At the same time, your comments on energy prices, interest rates, consumer weakness, political uncertainty and competition from China provided an important balance to the discussion. One of my main takeaways was that, although the macro environment remains challenging, the underlying earnings picture for European companies is still relatively strong.

We will share these insights with our colleagues in Tokyo and take them into account as we review our country, sector and index allocations.

If possible, we would also be grateful if you could share the updated material on Germany, the electronic copy of the presentation, and the analysis of the relationship between the yield curve and equity sectors that you mentioned during the meeting.

Thank you again for the highly informative discussion. I hope we can stay in touch and continue exchanging views in the future.

Best regards,

Kazuma Yoshimi
	② リスク管理担当者との面談要約

1．面談の目的

（1）国債、社債、ファンド・ファイナンスおよび証券貸借に関するリスク管理フレームワークの確認
（2）ストレステスト、VaR、期待ショートフォールおよび信用リスクモデルの実務的な利用方法の確認
（3）本店とのモデル共通化、モデル・ガバナンスおよび計算プロセス自動化に関する意見交換

2．対象業務と国債ポートフォリオの管理

（1）支店におけるリスク管理の対象業務

・面談での説明

* 投資ポートフォリオを運営するディーリングルーム、ファンド・ファイナンス、2つの証券貸借ビジネスという商品別の3分野
* 主として信用リスクを取るファンド・ファイナンス・ポートフォリオ
* 顧客資産のバイサイドリスクではなく、支店自身の投資・バランスシートリスクを中心とする管理対象

・先方のスタンス

* 商品特性に応じて異なる指標を使用しつつ、支店のリスク管理部門が横断的に管理する体制
* 今回の面談では、ファンド・ファイナンスよりも国債・社債ポートフォリオを中心とする説明

（2）国債ポートフォリオの日常的なリスク管理

・面談での説明

* 米国債、ユーロ圏国債、英国債および先物・オプション・スワップなどのヘッジ商品
* 簿価リミット、金利感応度、VaR、経済資本などを用いた日常管理
* 積極的に運用する自己勘定ポートフォリオであるため、EaRや純金利収入感応度など、一般的な銀行勘定指標の不使用

・先方のスタンス

* 通常時のポジション管理には、VaRや金利感応度などの標準的な市場リスク指標が有効との評価
* 銀行全体へ影響するテールリスクの把握には、日常的な指標だけでは不十分との認識

（3）金利環境の変化に伴う運用戦略の変化

・面談での説明

* 従来のキャリー収益中心の運用から、カーブ取引や相対価値取引を活用する運用への変化
* 先物、オプション、スワップなど、利用する金融商品の多様化
* 金利変動の拡大に伴う売買頻度の増加

・先方のスタンス

* 単純なキャリー戦略が機能しにくい環境に対応した、ポートフォリオ運営の適切な進化との評価
* 数年前と現在では、ポートフォリオの運用方法とリスク特性が大きく異なるとの認識

（4）銀行勘定とトレーディング勘定の区分

・面談での説明

* バーゼルIII最終化に伴う、銀行勘定とトレーディング勘定の境界明確化の必要性
* 積極的に売買するポートフォリオについても、銀行勘定に残せる可能性
* 区分の根拠について、銀行全体で一層明確な文書化が必要な状況

・先方のスタンス

* 現行ポートフォリオは銀行勘定に維持可能との見方
* 銀行全体としての整理は未完成であり、引き続き検討が必要との慎重な認識

3．ストレステストとテールリスク管理

（1）ストレステストの重要性

・面談での説明

* 2016年頃から導入されたストレステスト
* 通常のVaRや金利感応度では十分に捉えにくいテール事象の把握
* 支店単独ではなく、銀行全体に重大な影響を及ぼす可能性の確認

・先方のスタンス

* 日常管理にはVaR、重大なテールリスクの管理にはストレステストという役割分担
* 銀行全体への重大な影響を防ぐ観点では、ストレステストをVaR以上に重要視する姿勢

（2）ヒストリカル・シナリオ

・面談での説明

* 過去の具体的な市場局面を用いたシナリオ
* 2015年4月の債券市場変動など、市場参加者が当時の状況を想起しやすい名称の使用
* 現在と過去の環境が異なることを認識したうえでの、過去事象との比較

・先方のスタンス

* 関係者が直感的に理解しやすいことを重視したシナリオ設計
* 過去の市場変動をそのまま再現するのではなく、現在のポートフォリオへの影響を確認するための利用

（3）フォワードルッキング・シナリオ

・面談での説明

* 現在の経済・政治情勢を踏まえ、リスク管理部門が複数のシナリオ仮説を作成するプロセス
* シナリオの市場変動幅について、ディーリングルームからフィードバックを取得する運営
* トランプ政権、ホルムズ海峡など、現在想定されるグローバルマクロリスクの反映

・先方のスタンス

* リスク管理部門だけで数値を決定せず、フロント部門の市場感覚も取り入れる方針
* 何が上昇し、何が下落するかを正確に予想することは難しいとの前提に立つシナリオ設計

（4）MUFG EMEAとの連携

・面談での説明

* MUFG EMEAと基本的に共通するストレスシナリオの使用
* チーフエコノミストが主催する四半期ごとのストレステスト・フォーラムへの参加
* 非ドイツのユーロ圏国債など、ロンドン支店固有のエクスポージャーを踏まえた調整

・先方のスタンス

* グローバルマクロのシナリオについてはグループ内での整合性を重視
* 共通シナリオを機械的に適用せず、各拠点のポートフォリオ特性も反映する方針

（5）相関の構造変化とストレスVaR・期待ショートフォール

・当方からの問題提起

* 長期的には逆相関だった金と債券が、足元では同方向に動く可能性
* モデルの参照期間によって、分散効果やリスクを過小評価する可能性
* 短期相関を併用してリスクを確認する当方の対応

・先方の回答

* 時系列の構造変化や、一定期間だけ資産間の関係が変化する可能性への同意
* 現在のポートフォリオに過去の市場変動を適用するストレスVaRの利用
* 特定期間だけでなく、利用可能な全期間を計算対象とする期待ショートフォールの活用

・先方のスタンス

* 過去相関のみに依存することへの慎重な姿勢
* 期待ショートフォールを有用なテールリスク指標として評価
* 概念的には理解しやすい一方、実装が複雑で一般的な利用が限定的との認識

（6）シナリオの維持・見直し

・面談での説明

* 約20種類のヒストリカル・シナリオの保有
* 定例報告では、その時点で最も影響の大きいシナリオのみを選択
* 新たな市場変動データの追加が必要かを定期的に確認するプロセス

・先方のスタンス

* 現在のポートフォリオに対する影響が小さいという理由だけでは、既存シナリオを廃止しない方針
* ポートフォリオ構成の変化によって、以前は重要でなかったシナリオが再び重要になるとの認識

（7）ストレス期間とポートフォリオ管理の前提

・面談での説明

* 原則として20営業日を対象とするストレス期間
* 期間中にポートフォリオを変更せず、そのまま保有する静的な前提
* 実際の市場悪化時には、通常、ポジションを削減する可能性

・先方のスタンス

* ストレス期間は、実際の投資判断やリスク削減に必要な期間との整合が重要との見方
* ストレス損失は「何も対応できなかった場合」の厳しい結果であり、通常の運用結果とは異なるとの説明

（8）ストレステストのリミットへの利用

・面談での説明

* ストレステストを通常のハードリミットとしては使用しない運営
* トレーダーやポートフォリオマネジャーに保有リスクを認識させる目的
* 実現利益の低下や経済資本への圧力が高まった局面における、ストレス結果の追加的な利用

・先方のスタンス

* 通常時のポジション管理には標準的なリスク指標を優先
* 必要な局面でストレステストを意思決定へ取り込む柔軟な運営

4．社債ポートフォリオのリスク管理

（1）信用スプレッド感応度と金利ヘッジ

・面談での説明

* 社債ポートフォリオにおける主要な追加リスク指標としての信用スプレッド感応度
* 金利スワップを用いた金利リスクのヘッジ
* 完全なアセットスワップから、より低コストで包括的な金利ヘッジへの移行

・先方のスタンス

* 小規模な残余金利リスクを許容し、信用スプレッドリスクをより明確に管理する方針
* 完全ヘッジによるコストと、残存リスクとのバランスを重視する姿勢

（2）業種別・国別集中リスク

・面談での説明

* Bloombergの業種分類を用いた業種別分析
* 業種別集中度に対するソフトリミット
* 国別集中度にはリミットを設けず、日次モニタリングと月次の詳細確認

・先方のスタンス

* 国別よりも業種別の集中リスクを主要な管理軸とする方針
* フランスやドイツなどの政治・経済情勢に応じ、国別リスクも継続的に確認する姿勢

（3）ハイパースケーラー企業の債券

・面談での説明

* 既存のBloomberg業種分類では明確に区分されないハイパースケーラー企業
* ハイパースケーラーによる債券発行額の大幅な増加
* ポートフォリオにおけるハイパースケーラー債券のアンダーウェイト

・先方のスタンス

* Bloomberg分類は一貫性確保のため継続
* 新しい分類を独自に作るのではなく、ハイパースケーラー債券の合計保有額を別途報告する方針

（4）米国社債への投資拡大

・面談での説明

* 社債ポートフォリオの約50％を占める米国企業
* 欧州市場と比較して厚みがあり、流動性の高い米国社債市場
* 新発債の追加スプレッドを狙ったプライマリー市場中心の取引

・先方のスタンス

* 米国社債を信用リスク削減時に売却しやすい流動性資産として評価
* クレジット・デリバティブを使用せずに信用エクスポージャーを減らす場合、米国社債を優先的に売却する可能性

（5）クレジットカーブの構築

・面談での説明

* 個別発行体ではなく、外部格付け、通貨および業種によるクレジットカーブの分類
* Moody’s・S&Pの格付けとBloombergの業種データの組合せ
* 銘柄数が少ない格付け区分を統合するためのマッピング

・先方のスタンス

* バックテスト上の損益説明力と、十分なデータ量を確保できる分類を重視
* 個別企業ごとのカーブを無理に構築しない実務的な方針

（6）個別発行体リスクと流動性スリッページ

・面談での説明

* VaRレポート上での個別発行体への集中度の確認
* データ不足による、発行体固有のボラティリティの非定量化
* 信用市場悪化時における、欧州社債の評価価格対比30～50bp程度の売却コスト

・先方のスタンス

* モデル上の価格だけでなく、実際に売却可能な価格をディーリングデスクと確認する方針
* 流動性の低い市場では、リスク量に売却時のスリッページを加味することの重要性

5．モデル・ガバナンスと拠点間連携

（1）本店モデルとの整合性

・面談での説明

* ロンドンで取得する市場データの使用
* 本店モデルと可能な限り整合させた基本的なモデル手法
* 本店の自社開発プラットフォームに対し、ロンドン支店ではCalypsoへ実装

・先方のスタンス

* システムを完全に共通化するのではなく、モデル手法の整合性を重視
* ユーロ関連などの現地差異について、本店と協議したうえでの実装

（2）拠点間のモデル共有

・面談での説明

* ニューヨーク、東京、ロンドンにおける住宅ローン担保証券モデルの確認
* 香港拠点へのレバレッジ型ETFの計算方法の共有
* 複数拠点で計算結果が異なる場合の、スプレッドシートや計算ロジックの再確認

・先方のスタンス

* 各拠点が可能な限りモデルと計算方法を共有する方針
* ロンドン支店がグループモデルを所管するのではなく、本店へ改善案を提示する役割

（3）証券貸借のカウンターパーティ信用リスクモデル

・面談での説明

* 従来、一定水準以上の担保を受け入れても計測リスクが低下しなかった計算上の問題
* 追加担保に応じて計測リスクが低下するようにした計算方法の改定
* 改善案の本店への提案と採用

・先方のスタンス

* 実際に取っているリスクと計測値が同じ方向に動くことを重視
* 経済実態との整合性と、フロント部門への説明可能性を高く評価

6．KMV・CreditEdgeと早期警戒指標

（1）CreditEdgeの利用方法

・面談での説明

* Moody’s CreditEdgeから取得するEDFを個別企業へ直接マッピング
* 信用悪化の早期警戒指標としての試験的な利用
* 投資適格企業を中心とするポートフォリオ

・先方のスタンス

* 当該ポートフォリオでは、有効な早期警戒指標として十分な付加価値を確認できなかったとの評価
* 日常的なポートフォリオ管理では積極的に使用しない方針

（2）投資適格債におけるKMV型モデルの限界

・面談での説明

* 株価に基づくEDFが反応する前に、ニュースや政策変更から信用悪化を認識できる事例
* トランプ政権の政策による風力発電関連企業への影響
* 過去の株価ボラティリティでは捉えにくい将来の政策・イベントリスク

・先方のスタンス

* 投資適格債では、ニュースのモニタリングや個別企業へのストレス分析をより重視
* 市場データだけでなく、企業固有の事業・政策リスクを確認する方針

（3）KMV型モデルの業界慣行としての位置付け

・面談での説明

* 株価ベースの信用モデルは、一般的に利用されている標準的なアプローチ
* MUFG銀行における資本モデルへの組込み
* 投資不適格債や流動性の高い企業では、より有効となる可能性

・先方のスタンス

* 一般的なモデルであることと、個別ポートフォリオに有効であることは別との認識
* 資本削減効果などの明確な便益がなければ、導入を積極的には推奨しない姿勢

（4）非上場企業の取扱い

・面談での説明

* 株価データを利用できない非上場企業
* Moody’sのCredit Risk Databaseと回帰モデルを利用する代替的な推計
* 類似企業や財務データとのマッピングによる代理格付け

・先方のスタンス

* 上場企業と非上場企業で異なる手法を使い分ける実務的な対応
* Bloomberg DRSKなど、企業属性に応じてモデルを切り替えるベンダーツールの利用

（5）株価・CDS・ニュースによるモニタリング

・面談での説明

* CreditEdge以上に有用だった株価変動のモニタリング
* 流動性や価格精度に課題のある一部企業のCDS
* 投資銘柄数が数千に増えた場合における、ニュースモニタリングの困難化

・先方のスタンス

* 現在のポートフォリオでは、株価とニュースのモニタリングを早期警戒の中心に位置付け
* 大規模ポートフォリオでは、ニュース分析を効率化する技術への関心

（6）Mertonモデルからの拡張とジャンプ過程

・当方からの質問

* Distance to DefaultからEDFへの変換方法
* 満期前デフォルトを表現するバリア型モデルの利用
* 突然の信用悪化を表現するジャンプ過程の導入可能性

・先方の回答

* CreditEdgeの基礎となるMerton型の枠組みと、その後のMoody’sによる独自拡張
* デフォルトポイントへの到達を考慮するバリア型の考え方
* 現行モデルにジャンプ過程が含まれているかは不明との回答

・先方のスタンス

* Moody’sによるバックテストとモデル改善を利用し、自社でモデルを一から構築しない方針
* 詳細なモデル構造については、CreditEdgeの方法論資料を確認することを推奨

（7）データ品質と自社モデル構築の課題

・面談での説明

* ヒストリカル・ボラティリティとインプライド・ボラティリティの選択問題
* 個別株オプションにおけるインプライド・ボラティリティの価格品質
* 株式分割、配当、M&Aなどのコーポレートアクション処理

・先方のスタンス

* 数理モデルそのものよりも、入力データの品質が実務上の大きな課題との評価
* 売り手側の信頼できるデータ基盤がなければ、自社モデルの構築は大規模な作業になるとの認識

7．投資規律と経営層への報告

（1）月次投資委員会へのストレス結果の提示

・当方からの提案

* 経営層が参加する月次投資委員会におけるストレス結果の報告
* ストレス発生時の損失規模を事前に共有することによる経営上の準備
* ポートフォリオのリスク管理規律を示す手段としての活用

・先方の回答

* ストレス結果は、ポートフォリオを期間中に一切変更しない厳しい前提
* 実際には市場悪化時にポジションを削減する可能性
* 市場が流動性を失い、対応できない場合の潜在損失を示す指標としての意味

（2）協議トリガーとストップロス

・面談での説明

* 銀行勘定の投資ポートフォリオで使用する「協議・相談水準」
* ポジションの継続運用を前提とした、関係者間の検討開始基準
* ポジションの解消を前提とするトレーディング勘定のストップロスとの相違

・先方のスタンス

* 投資ポートフォリオでは、機械的な損切りよりも協議トリガーが適切との判断
* 市場下落後に機械的に売却すると、その後の回復を逃す可能性への注意
* 一方、一定のルールに基づいて議論を開始する投資規律の有用性

（3）リスクに関する会議体

・面談での説明

* ディーリングデスクによる日次会議
* リスク管理部門を含む正式な週次会議
* 経営層を含む月次会議

・先方のスタンス

* 単一のリミットに依存せず、異なる頻度の会議でリスクを継続的に検討する体制
* 新たなリスクが顕在化した場合の、フォワードルッキング・シナリオの機動的な作成

* VaRモデルと期待ショートフォールモデルを対象としたレビュー
* Calypsoと追加スプレッドシートを含むモデル構成図の作成

・先方のスタンス

* モデルを図示することによる、計算プロセスの複雑性の把握

* スプレッドシートに残る一部の追加計算
* 計算実行と結果確認を行う自動化スクリプト

・先方のスタンス

* さらなる自動化は可能との認識
* 人員・開発リソースの制約が追加的な自動化の主要な障壁との評価

* 担当者の確認後に行うメールの自動送信

① 欧州株式ストラテジスト面談要約

1．面談の目的

（1）欧州株式の投資意義、業績見通しおよび主要リスクに関する意見交換
（2）国別・セクター別の有望分野と、当方の投資制約に適した指数の確認

2．欧州株式の全体評価

（1）欧州株式の相対パフォーマンスと資金フローの改善

・面談での説明

* 過去2年間における、ドルベースのMSCI EuropeのS&P 500に対するアウトパフォーム
* 長期間の資金流出を経た、2025年初め以降の欧州株式への断続的な資金流入
* 米国・イラン情勢の緊迫化に伴う一時的な資金流入の停止と、直近5週間の継続的な流入再開

・先方のスタンス

* 欧州株式への前向きな見方の継続
* 欧州への資金流入は、市場規模との対比で十分に意味のある水準との評価

（2）グローバルポートフォリオにおける欧州株式の分散機能

・面談での説明

* 米国株や一部のAI関連銘柄への集中を緩和する投資先としての欧州株式
* 世界の他地域でリスクが高まった場合の分散先としての機能
* AI関連投資からの全面的な撤退ではなく、AI投資と欧州への分散の併存

・先方のスタンス

* 欧州を「優れた分散先」と位置付ける強気姿勢
* AI関連株か欧州株かという二者択一ではなく、双方を組み合わせる投資方針

（3）欧州企業の利益成長

・面談での説明

* MSCI Europeのコンセンサス利益成長率19％
* エネルギーを除いた利益成長率14.8％、中央値ベースの利益成長率11％
* 2027年についても約11％の利益成長見通し

・先方のスタンス

* 「欧州には成長がない」との市場認識は誤解との判断
* 世界的な設備投資サイクルの恩恵を受ける欧州企業への前向きな評価

（4）欧州企業のインフレ耐性

・面談での説明

* MSCI Europeの利益の約60％を占める実物資産、コモディティ、銀行などのインフレ恩恵業種
* エネルギーを除いたEBITマージンの過去最高水準
* 欧州企業の売上の約45％が欧州域内、約55％が欧州域外というグローバルな収益構造

・先方のスタンス

* インフレ環境は欧州企業全体に必ずしも不利ではないとの見方
* エネルギー高による欧州企業利益への悪影響を市場が過大評価しているとの判断

3．銀行・ECB・エネルギー価格

（1）銀行セクターへの強気姿勢

・面談での説明

* 高金利の長期化による銀行の純金利マージン改善
* 欧州PMIの底堅さと貸出増加率の回復
* 2027年までの健全な貸出増加見通し
* 政策金利だけでなく、右上がりまたは高水準のイールドカーブによる収益押上げ

・先方のスタンス

* 銀行を欧州株式の中で特に有望なセクターとして評価
* 貸出への悪影響より、金利上昇による収益改善効果を重視
* 銀行をセクターモデル上のオーバーウェイト対象とする姿勢

（2）ECBの利上げによる景気への影響

・当方からの質問

* 利上げによる銀行の金利収入増加と、企業の借入減少という正負両面の影響
* 銀行以外でECBの金融引締めから悪影響を受けるセクターの確認

・先方の回答

* 想定する利上げ幅は200bpではなく、25～50bp程度
* 政策金利は3％未満で、中立金利とされる2％程度から大きく乖離していないとの認識
* 利上げの主目的は景気抑制ではなく、インフレ期待の安定

・先方のスタンス

* 小幅な利上げによる実体経済への影響は限定的との見方
* 銀行にとっては貸出減少よりも純金利マージン改善の効果が大きいとの評価

（3）ECBの追加利上げと高金利の長期化

・面談での説明

* 市場による10月の追加利上げの織込み
* 先方チームの基本シナリオには追加利上げを含めない予想
* エネルギー高の長期化に伴う、利上げ方向への上振れリスク

・先方のスタンス

* 追加利上げがなくても、金利の高止まりだけで銀行利益にはプラスとの判断
* 年初に想定された利下げと銀行利ざや縮小からの見通しの転換

（4）エネルギー高によるダウンサイドリスク

・面談での説明

* 2022年対比での欧州企業のエネルギー効率改善
* 2022年を大幅に下回る現在のガス価格
* エネルギー価格が基本シナリオを上回った場合の投資家心理悪化と株価マルチプル低下

・先方のスタンス

* 現在と2022年を単純に比較することへの否定的な見方
* エネルギー高による利益崩壊よりも、短期的な株価評価の低下を主要リスクとする判断
* 利益見通しが維持される限り、下落局面は投資機会との評価

4．国別・指数別の投資判断

（1）国別指数とセクター指数の選択

・当方からの質問

* 個別株や銀行セクター指数へ投資できないファンドにおける、DAX、CAC 40、FTSE、Euro STOXX等の選択
* 銀行比率を踏まえた有望な国別指数の確認

・先方の回答

* 銀行比率の高いスペインおよびイタリア
* 英国、フランス、ドイツの主要3市場では英国の相対的に高い順位
* 国別投資よりもセクター別投資を優先する方針

・先方のスタンス

* 可能であれば銀行などの有望セクターへの直接投資を推奨
* 国別指数に限定される場合の英国および欧州周辺国への選好

（2）ドイツおよびDAX

・面談での説明

* 世界売上比率の高い企業が多く、ドイツ国内経済との連動性が限定的なDAX
* SAP、Deutsche Telekom、Siemensなど大型銘柄による指数への影響
* ドイツのインフラ投資を直接反映しにくい指数構成

・先方のスタンス

* 国別モデル上のドイツの低い順位
* ドイツ国内のインフラ投資を捉える場合の、DAXよりも関連銘柄バスケットへの選好

（3）フランスおよびCAC 40

・面談での説明

* 大統領選挙と世論調査を巡る政治的不透明感
* GDP比5％超の財政赤字と財政再建の必要性
* 政治リスクの半分程度は既に市場へ織り込まれているとの推計

・先方のスタンス

* 政治的不透明感が指数全体の上値を抑えるとの慎重姿勢
* 指数全体よりも、政策の影響を受けにくい個別企業への選好
* フランスの政治リスクを表現する手段として、株式より債券が適する可能性

（4）英国およびFTSE 100

・面談での説明

* 英国企業の英国国内売上比率は約29％
* エネルギー、金属、生活必需品、銀行などの高い構成比率
* 米国やアジアの経済動向から影響を受けるグローバルな指数

・先方のスタンス

* 英国自体については中立評価
* 英国、フランス、ドイツの主要3市場ではFTSE 100を相対的に高く評価
* FTSE 100への投資は、英国国内経済への投資とは異なるとの注意喚起

5．ギリシャおよび政治リスク

（1）ギリシャの先進国市場への格上げ

・面談での説明

* STOXX・FTSEによる先進国市場への格上げと、MSCIによる翌年5月の格上げ予定
* MSCI Europeへの約6銘柄の組入れ見込み
* 四大銀行が指数の約80％を占める銀行中心の構成

・先方のスタンス

* ギリシャ銀行をベンチマーク外のオーバーウェイトとして追加
* 先進国投資家がギリシャを新たに発見する局面との強気評価

（2）先進国投資家による追加投資余地

・面談での説明

* ギリシャへの何らかのエクスポージャーを持つファンドの割合は約30％
* ギリシャ銀行株を保有するファンドの割合は約16％
* 同程度の指数比率を持つアイルランド銀行株と比べても低い保有率

・先方のスタンス

* 先進国投資家による追加購入余地は大きいとの判断
* PPCなど一部銘柄に偏った保有から、銀行への投資拡大を見込む姿勢

（3）ギリシャの中期的な成長余地

・面談での説明

* ソブリン債務危機後の約15年間にわたる住宅ローン市場の低迷
* ユーロ圏他国への可処分所得のキャッチアップ余地
* 新民主主義党政権下における財政再建と投資誘致

・先方のスタンス

* 現在の政治体制が継続すれば、今後3～5年間の成長余地との評価
* 指数内比率は小さいものの、投資可能な流動性を有する市場との判断

（4）ギリシャ投資のリスク

・面談での説明

* 総選挙で単独過半数を獲得できない場合の再選挙の可能性
* MSCI組入れ前の先回り買いと、組入れ後の利益確定売り
* 選挙とMSCI組入れ時期の重複

・先方のスタンス

* 選挙や指数組入れに伴う短期的な上値抑制への警戒
* 新民主主義党が安定多数を維持する限り、下落は投資機会との判断

（5）フランス大統領選挙

・面談での説明

* 極端な政策を掲げる候補者の勝利に対する市場の警戒
* 大統領の政策実行に必要となる国民議会の支持
* 国民議会に安定多数が存在しないことによる政策実行上の制約

・先方のスタンス

* フランスを欧州の選挙リスクの中で最も重要な国として注視
* 市場が新政権の実行力を過大評価して売り込んだ場合の投資機会

（6）スペイン・イタリア

・面談での説明

* スペインにおける中道右派への政権交代、法人減税、防衛費増加の可能性
* イタリアにおける政治・財政リスクと活発な銀行M&A
* イタリアのリスクが年末に向けて徐々に市場へ織り込まれるとの予想

・先方のスタンス

* スペインの企業寄り政策への転換を市場が十分に注目していないとの認識
* イタリアのリスクについても市場の織込みが不十分との慎重な評価

6．財政政策・AI・中長期的な構造変化

（1）ドイツの財政拡張

・面談での説明

* インフラ投資などを通じたドイツ経済への一定の下支え
* 政府支出の多くが社会支出に向かい、企業の売上や利益にはまだ反映されていない状況
* 追加支出の余地を持つドイツと、財政規律が求められるフランスとの差異

・先方のスタンス

* ドイツ経済への効果は認めつつ、現時点の企業利益への影響は中立との判断
* 財政政策の発表自体よりも、企業収益への実際の波及を重視する姿勢

（2）AI設備投資と欧州資本財

・面談での説明

* 産業カンファレンスで確認されたデータセンター建設と電化投資への強い需要
* 建材・建築製品を含む企業のコスト転嫁力
* AI関連株を巡る短期的な市場センチメントの大幅な変動

・先方のスタンス

* AI設備投資のファンダメンタルズに変化はないとの強気姿勢
* AI関連資本財およびAIを可能にする企業群へのオーバーウェイト
* 電化投資についても減速の兆候はないとの評価

（3）AIによる人口動態問題の補完

・当方からの質問

* ホワイトカラー業務や将来のブルーカラー業務の自動化可能性
* AIによる生産性向上が社会全体を良くするかという問題
* AIに対する欧州での一般的な受け止め方

・先方の回答

* 欧州と日本に共通する人口動態問題への解決策としてのAI
* 生産性向上による労働力減少の一部相殺
* 銀行などAI導入側企業のコスト削減と成長率改善

・先方のスタンス

* AIの生産性向上効果については基本的に前向きな評価
* 人口減少への対応という欧州固有の文脈から、AI導入を肯定的に評価する姿勢

（4）AIによる人員削減と雇用への影響

・面談での説明

* 2030年頃までの欧州銀行における10～20％の人員削減可能性
* 現在3人で行っている業務を1人で行えるようになる可能性
* 顧客対応など、人間同士の関係が重要な業務の継続

・先方のスタンス

* 人員削減を企業の生産性向上要因としてセクターモデルへ反映
* すべての仕事が代替されるのではなく、業務の種類によって影響が異なるとの見方

（5）若年雇用と個人消費への影響

・面談での説明

* 英国の若年層における失業率上昇
* 最低賃金引上げによるエントリーレベル人材の採用コスト増加
* AIによる雇用代替が一部影響している可能性

・先方のスタンス

* 最低賃金とAIの影響を正確に分離することは困難との慎重な認識
* 雇用悪化が消費へ波及する可能性から、消費関連セクターを相対的に慎重視

（6）AIに対する規制の必要性

・当方からの質問

* AIが社会全体にもたらすプラス効果と潜在的な不安
* AIの発展に対する欧州での一般的な見方

・先方の回答

* 「最終的には規制が必要になる」との個人的な見解
* 企業側も規制や明確なルールを求め始めているとの認識
* 非常に新しい分野であり、依然として不明な点が多いとの説明

・先方のスタンス

Function FileExistsEx(path)
    FileExistsEx = CreateObject("Scripting.FileSystemObject").FileExists(path)
End Function

Function TryExcelExtensions(basePath)
    Dim fso, exts, i, full
    Set fso = CreateObject("Scripting.FileSystemObject")
    exts = Array(".xlsm", ".xlsx", ".xlsb", ".xls")
    For i = 0 To UBound(exts)
        full = basePath & exts(i)
        If fso.FileExists(full) Then
            TryExcelExtensions = full
            Exit Function
        End If
    Next
    If fso.FileExists(basePath) Then
        TryExcelExtensions = basePath
    Else
        TryExcelExtensions = ""
    End If
End Function

Function ResolveExcelPath(rawPath)
    Dim fso, scriptDir
    Dim hasSep, p, basePath, dotPos, sepPos, full

    Set fso = CreateObject("Scripting.FileSystemObject")
    scriptDir = fso.GetParentFolderName(WScript.ScriptFullName)

    p = Trim(rawPath)
    If p = "" Then
        ResolveExcelPath = ""
        Exit Function
    End If

    hasSep = (InStr(p, "\") > 0) Or (InStr(p, ":") > 0)

    If hasSep Then
        If fso.FileExists(p) Then
            ResolveExcelPath = p
            Exit Function
        End If

        sepPos = InStrRev(p, "\")
        basePath = p
        dotPos = InStrRev(basePath, ".")
        If dotPos > sepPos Then
            basePath = Left(basePath, dotPos - 1)
        End If

        ResolveExcelPath = TryExcelExtensions(basePath)
    Else
        full = fso.BuildPath(scriptDir, p)
        If fso.FileExists(full) Then
            ResolveExcelPath = full
            Exit Function
        End If

        basePath = p
        dotPos = InStrRev(basePath, ".")
        If dotPos > 0 Then
            basePath = Left(basePath, dotPos - 1)
        End If

        ResolveExcelPath = TryExcelExtensions(fso.BuildPath(scriptDir, basePath))
    End If
End Function

Function GetNamedCell(wb, nmStr)
    Dim nm
    On Error Resume Next
    Set GetNamedCell = Nothing

    ' まずダイレクトに試す
    Set GetNamedCell = wb.Names(nmStr).RefersToRange
    If Err.Number = 0 And Not GetNamedCell Is Nothing Then
        On Error GoTo 0
        Exit Function
    End If
    Err.Clear

    ' 見つからなければ全 Names を総当たり
    For Each nm In wb.Names
        If InStr(1, nm.Name, nmStr, 1) > 0 Then
            Set GetNamedCell = nm.RefersToRange
            Exit For
        End If
    Next
    On Error GoTo 0
End Function

    On Error Resume Next
    Dim v
    v = statusCell.Value
    If Err.Number <> 0 Then

        GetStatus = 3
        Exit Function
    End If
    If IsNumeric(v) Then
        GetStatus = CLng(v)
    Else
        GetStatus = 3
    End If
End Function

    Set postCheckCell  = GetNamedCell(wb, "VBA実行後チェック")
    Set postMsgCell    = GetNamedCell(wb, "VBA実行後表示メッセージ")

    hasJudge = Not (statusCell Is Nothing)

    '--- VBA自動実行中フラグ ON (1) ---
    If Not runningCell Is Nothing Then
        On Error Resume Next
        runningCell.Value = 1
        On Error GoTo 0
    End If

    ' 計算モード自動
    xlApp.Calculation = -4105   ' xlCalculationAutomatic

    ' 最初の全再計算
    xlApp.CalculateFullRebuild
    WScript.Sleep waitShort

    ' ===== blg更新判定 が無い場合は Bloomberg 判定スキップ =====
    If Not hasJudge Then

        ExecuteMacroIfNeeded xlApp, macroName, index, filePath

        '--- VBA実行後チェック（0=正常 / 1=エラー / 2=留意点あり / 3=留意点あり(サイレント)）---
        If Not postCheckCell Is Nothing Then
            Dim vPost, postStatus
            postStatus = 0
            On Error Resume Next
            vPost = postCheckCell.Value
            If Err.Number = 0 And IsNumeric(vPost) Then
                postStatus = CLng(vPost)
            End If
            Err.Clear
            On Error GoTo 0

            If postStatus = 1 Then
                HandlePostVBAError wb, index, filePath, postMsgCell, runningCell
                Exit Sub
            ElseIf postStatus = 2 Then
                HandlePostVBAWarning wb, index, filePath, postMsgCell, runningCell
                Exit Sub
            ElseIf postStatus = 3 Then
                HandlePostVBAWarningSilent wb, index, filePath, postMsgCell, runningCell
                Exit Sub
            End If
        End If

        ' 正常パス：フラグを0に戻して保存・クローズ
        If Not runningCell Is Nothing Then
            On Error Resume Next
            runningCell.Value = 0
            On Error GoTo 0
        End If

        wb.Save
        wb.Close False
        results(index) = Array("OK", "判定なし（blg更新判定 なし）")
        Exit Sub
    End If

    '================ Bloomberg 判定ループ ==================
    finalStatus = 3

    For i = 1 To maxCheckLoop
        s = GetStatus()
        finalStatus = s

        Select Case s
            Case 0
                Exit For

            Case 1
                WScript.Sleep waitShort

            Case 2
                WScript.Sleep waitLong
                xlApp.CalculateFull

            Case 3
                ' Bloomberg 未接続/エラー
                bjv = ""
                If Not statusCell Is Nothing Then
                    On Error Resume Next
                    bjv = statusCell.Value
                    On Error GoTo 0
                End If
                If bjv <> "" Then
                    bloomJudgeArr(index) = bjv
                End If

                results(index) = Array("ERROR", "Bloomberg 未接続/エラー")
                hadError = True

                If Not runningCell Is Nothing Then
                    On Error Resume Next
                    runningCell.Value = 0
                    On Error GoTo 0
                End If

                wb.Close False
                AskContinueOrExit index, filePath, "Bloomberg 未接続/エラー"
                Exit Sub

            Case Else
                results(index) = Array("ERROR", "想定外ステータス: " & s)
                hadError = True

                If Not runningCell Is Nothing Then
                    On Error Resume Next
                    runningCell.Value = 0
                    On Error GoTo 0
                End If

                wb.Close False
                AskContinueOrExit index, filePath, "想定外ステータス"
                Exit Sub
        End Select
    Next

    '================ 最終処理（finalStatus=0 の時） ==================
    If finalStatus = 0 Then
        ' マクロ実行（失敗時は中で AskContinueOrExit を呼んでいる）
        If ExecuteMacroIfNeeded(xlApp, macroName, index, filePath) = False Then
            If Not runningCell Is Nothing Then
                On Error Resume Next
                runningCell.Value = 0
                On Error GoTo 0
            End If
            wb.Close False
            Exit Sub
        End If

        '--- VBA実行後チェック（0=正常 / 1=エラー / 2=留意点あり / 3=留意点あり(サイレント)）---
        If Not postCheckCell Is Nothing Then
            Dim vPost2, postStatus2
            postStatus2 = 0
            On Error Resume Next
            vPost2 = postCheckCell.Value
            If Err.Number = 0 And IsNumeric(vPost2) Then
                postStatus2 = CLng(vPost2)
            End If
            Err.Clear
            On Error GoTo 0

            If postStatus2 = 1 Then
                HandlePostVBAError wb, index, filePath, postMsgCell, runningCell
                Exit Sub
            ElseIf postStatus2 = 2 Then
                HandlePostVBAWarning wb, index, filePath, postMsgCell, runningCell
                Exit Sub
            ElseIf postStatus2 = 3 Then
                HandlePostVBAWarningSilent wb, index, filePath, postMsgCell, runningCell
                Exit Sub
            End If
        End If

        ' 正常パス：フラグを0に戻して保存・クローズ
        If Not runningCell Is Nothing Then
            On Error Resume Next
            runningCell.Value = 0
            On Error GoTo 0
        End If

        wb.Save
        wb.Close False
        results(index) = Array("OK", "")
    Else
        results(index) = Array("ERROR", "ステータス0にならず（finalStatus=" & finalStatus & "）")
        hadError = True

        If Not runningCell Is Nothing Then
            On Error Resume Next
            runningCell.Value = 0
            On Error GoTo 0
        End If

        wb.Close False
        AskContinueOrExit index, filePath, "Bloomberg更新失敗（最終ステータス≠0）"
        Exit Sub
    End If
End Sub

'====================================================
' マクロ実行
'====================================================

Function ExecuteMacroIfNeeded(xlApp, macroName, index, filePath)
    ExecuteMacroIfNeeded = True
    If macroName <> "" Then
        On Error Resume Next
        xlApp.Run macroName
        If Err.Number <> 0 Then
            results(index) = Array("ERROR", "マクロ実行失敗：" & Err.Description)
            hadError = True
            Err.Clear
            ExecuteMacroIfNeeded = False
            AskContinueOrExit index, filePath, "マクロ実行失敗"
        End If
        On Error GoTo 0
    End If
End Function

'====================================================
' VBA実行後チェック =1 のとき（エラー）
'====================================================

Sub HandlePostVBAError(wb, index, filePath, postMsgCell, runningCell)
    Dim shell
    Dim detailMsg, baseMsg, extra
    Dim retSave, retCont, nextIndex

    Set shell = CreateObject("WScript.Shell")

    extra = ""
    If Not postMsgCell Is Nothing Then
        On Error Resume Next
        extra = CStr(postMsgCell.Value)
        On Error GoTo 0
        If Trim(extra) <> "" Then
            postMsgArr(index) = extra
        End If
    End If

    If Trim(extra) <> "" Then
        detailMsg = vbCrLf & "【詳細】" & extra
    Else
        detailMsg = ""
    End If

    baseMsg = (index + 1) & "番目のブック「" & filePath & "」でVBA実行後にエラー発生。" & detailMsg

    ' 1) このブックを保存しますか？
    retSave = shell.Popup(baseMsg & vbCrLf & vbCrLf & "このブックを保存しますか？", _
                          0, "VBA実行後エラー", 4 + 48)
    If retSave = 6 Then ' Yes
        On Error Resume Next
        wb.Save
        On Error GoTo 0
    End If

    ' 2) 次以降を継続しますか？
    nextIndex = index + 2
    retCont = shell.Popup("続けて " & nextIndex & "番目以降のブックを実行しますか？", _
                          0, "処理継続確認", 4 + 32)
    If retCont = 7 Then ' No
        interrupted = True
    End If

    ' フラグを0に戻す
    If Not runningCell Is Nothing Then
        On Error Resume Next
        runningCell.Value = 0
        On Error GoTo 0
    End If

    wb.Close False

    results(index) = Array("ERROR", "VBA実行後エラー")
    hadError = True
End Sub

'====================================================
' 2：VBA実行後チェック =2 のとき（留意点あり＝OK＋コメント、要確認）

Sub HandlePostVBAWarning(wb, index, filePath, postMsgCell, runningCell)
    Dim shell

    extra = ""

    End If

    baseMsg = (index + 1) & "番目のブック「" & filePath & "」で留意点あり。" & detailMsg

    ' 1) このブックを保存しますか？
    retSave = shell.Popup(baseMsg & vbCrLf & vbCrLf & "このブックを保存しますか？", _
                          0, "留意点あり", 4 + 48)
    If retSave = 6 Then ' Yes
        On Error Resume Next
        wb.Save
        On Error GoTo 0
    End If

    ' 2) 次以降を継続しますか？
    nextIndex = index + 2
    retCont = shell.Popup("続けて " & nextIndex & "番目以降のブックを実行しますか？", _
                          0, "処理継続確認", 4 + 32)

'====================================================
' 3：VBA実行後チェック =3 のとき（留意点あり＝OK＋コメント、途中確認無し）
'====================================================

Sub HandlePostVBAWarningSilent(wb, index, filePath, postMsgCell, runningCell)
    Dim extra

    extra = ""
    If Not postMsgCell Is Nothing Then
        On Error Resume Next
        extra = CStr(postMsgCell.Value)
        On Error GoTo 0
        If Trim(extra) <> "" Then
            postMsgArr(index) = extra

'====================================================
' エラー時 Yes/No ポップアップ（Bloomberg系・マクロ系など）
'====================================================

Sub AskContinueOrExit(index, filePath, msg)
    Dim shell
    Dim nextIndex
    Dim ret

    Set shell = CreateObject("WScript.Shell")
    nextIndex = index + 2  ' 人間向け 1始まり

    ret = shell.Popup( _
        (index + 1) & "番目のブック「" & filePath & "」でエラー発生：" & vbCrLf & _
        "【" & msg & "】" & vbCrLf & vbCrLf & _
        nextIndex & "番目以降のブックの実行を継続しますか？", _
        0, "エラー発生", 4 + 32)

    If ret = 7 Then
        interrupted = True
    End If
End Sub

'      - 無い：判定スキップ → マクロA（指定あれば）実行 → 保存 → 閉じる
'      - 有る：ステータス監視ループ
'         * 0：OK → マクロA（指定あれば）実行 → 保存 → 閉じる
'         * 1：更新中 → waitShort 待って再度 GetStatus（再計算なし）
'         * 2：最新でない → waitLong 待ってから CalculateFull → 再度判定
'         * 3 / その他：エラー扱い → 保存せず閉じる
'
'   ※ この VBS は Bloomberg 専用マクロ呼び出しは一切せず、
'      「再計算による更新＋blg更新判定セルのロジック」に完全依存する設計。
'====================================================

Option Explicit

'================ ユーザー設定ゾーン =====================

' ▼ 処理したい Excelファイル と「成功時に実行するマクロ名」のセット
'   形式: Array( Array("ファイルパス1", "マクロ名1"), _
'                Array("ファイルパス2", ""), _
'                Array("ファイルパス3", "Module1.Cleanup") )
'   マクロ名が "" の場合、そのブックではマクロ実行をスキップ。
Dim jobs
jobs = Array( _
    Array("C:\Path\To\Book1.xlsm", "MacroA"), _
    Array("C:\Path\To\Book2.xlsm", ""), _
    Array("C:\Path\To\Book3.xlsm", "Module1.PostProcess") _
)

' ▼ 待ち時間（ミリ秒）
Dim waitShort, waitLong
waitShort = 5000   ' ステータス1のときの再チェック待ち (5秒)
waitLong  = 15000  ' ステータス2のときの待ち＋再計算 (15秒)

' ▼ ステータス監視の最大ループ回数
Dim maxCheckLoop
maxCheckLoop = 30   ' 1/2 状態でぐるぐるしすぎないための上限

'====================================================

Dim excelApp
Dim statusCell
Dim hadError
hadError = False

'================ ステータス取得関数 ========================
' Named Range "blg更新判定" からステータス(0/1/2/3)を Long で取得
' 読めなかった場合は 3 を返す（エラー扱い）
Function GetStatus()
    On Error Resume Next
    Dim v
    v = statusCell.Value

    If Err.Number <> 0 Then
        Err.Clear
        GetStatus = 3   ' エラー → 異常扱い
        Exit Function
    End If

    If IsNumeric(v) Then
        GetStatus = CLng(v)
    Else
        GetStatus = 3   ' 数値でない → 異常扱い
    End If
End Function

'================ 単一ブック処理 ========================
Sub ProcessWorkbook(ByVal xlApp, ByVal filePath, ByVal macroName)
    Dim wb
    Dim s, i
    Dim finalStatus
    Dim hasJudge As Boolean

    On Error Resume Next
    Set wb = xlApp.Workbooks.Open(filePath)
    If Err.Number <> 0 Then
        WScript.Echo "[ERROR] ブックを開けませんでした: " & filePath & " / " & Err.Description
        Err.Clear
        hadError = True
        Exit Sub
    End If
    On Error GoTo 0

    WScript.Echo ">> 開始: " & filePath

    '==== blg更新判定 Named Range の存在チェック ====
    On Error Resume Next
    Set statusCell = wb.Names("blg更新判定").RefersToRange
    If Err.Number <> 0 Then
        ' ★ Named Range がない → 判定スキップモード
        hasJudge = False
        Err.Clear
    Else
        hasJudge = True
    End If
    On Error GoTo 0

    '------ Excel計算モードを自動(Automatic)に ------
    ' xlCalculationAutomatic = -4105
    xlApp.Calculation = -4105

    '------ 最初の再計算（これを1回だけ） ------
    xlApp.CalculateFullRebuild
    WScript.Sleep waitShort

    '===== 判定スキップモードの場合 =====
    If Not hasJudge Then
        WScript.Echo "  [INFO] blg更新判定 が無いため、判定をスキップします。"

        ' マクロ名が指定されていれば実行
        If macroName <> "" Then
            On Error Resume Next
            WScript.Echo "  [INFO] マクロ実行（判定スキップ）: " & macroName
            xlApp.Run macroName
            If Err.Number <> 0 Then
                WScript.Echo "  [ERROR] マクロ実行に失敗: " & macroName & " / " & Err.Description
                Err.Clear
                hadError = True
            End If
            On Error GoTo 0
        End If

        ' 保存して終了
        wb.Save
        WScript.Echo "  [INFO] 保存完了（判定スキップ）: " & filePath
        wb.Close False
        WScript.Echo ">> 終了（判定スキップ）: " & filePath
        Exit Sub
    End If

    '================= ここから通常のステータス判定 ===============
    finalStatus = 3 ' デフォルトは異常扱い

    For i = 1 To maxCheckLoop

        s = GetStatus()
        finalStatus = s

        Select Case s
            Case 0
                WScript.Echo "  [INFO] Bloomberg 更新完了（ステータス0）"
                Exit For

            Case 1
                ' 更新中：ただ待つだけ。再計算はしない
                WScript.Echo "  [INFO] 更新処理中（ステータス1）。再チェック待機 " & (waitShort / 1000) & " 秒。"
                WScript.Sleep waitShort

            Case 2
                ' 最新でない：待ってから再計算して再チェック
                WScript.Echo "  [INFO] データが最新でない可能性（ステータス2）。待機 " & (waitLong / 1000) & " 秒後に再計算。"
                WScript.Sleep waitLong
                xlApp.CalculateFull  ' ★ここだけ再計算を許可（必要最小限）

            Case 3
                WScript.Echo "  [ERROR] ステータス3：未接続/エラー。保存せず終了します。"
                hadError = True
                Exit For

            Case Else
                WScript.Echo "  [ERROR] 想定外ステータス: " & s & "。保存せず終了します。"
                hadError = True
                Exit For
        End Select

    Next

    '===== 最終ステータスで結果処理 =====
    If finalStatus = 0 Then

        ' マクロ実行
        If macroName <> "" Then
            On Error Resume Next
            WScript.Echo "  [INFO] マクロ実行: " & macroName
            xlApp.Run macroName
            If Err.Number <> 0 Then
                WScript.Echo "  [ERROR] マクロ実行失敗: " & macroName & " / " & Err.Description
                Err.Clear
                hadError = True
            End If
            On Error GoTo 0
        End If

        wb.Save
        WScript.Echo "  [INFO] 保存完了: " & filePath
        wb.Close False

    Else
        ' ステータス0以外：保存せず閉じる
        WScript.Echo "  [WARN] ステータス0以外(" & finalStatus & ")のため、保存せずクローズ: " & filePath
        wb.Close False
    End If

    WScript.Echo ">> 終了: " & filePath
End Sub

'================ メイン ========================

On Error Resume Next
Set excelApp = CreateObject("Excel.Application")
If Err.Number <> 0 Then
    WScript.Echo "[FATAL] Excel を起動できませんでした: " & Err.Description
    WScript.Quit 1
End If
On Error GoTo 0

' 自動バッチ用設定（画面非表示・アラート抑制）
excelApp.Visible = False
excelApp.DisplayAlerts = False
excelApp.EnableEvents = False

Dim job, filePath, macroName
For Each job In jobs
    filePath = job(0)
    macroName = job(1)
    ProcessWorkbook excelApp, filePath, macroName
Next

excelApp.Quit
Set excelApp = Nothing

If hadError Then
    WScript.Echo "=== 終了（エラーあり）==="
    WScript.Quit 1
Else
    WScript.Echo "=== 正常終了（全ブックOK or ステータス0以外は非保存クローズ）==="
    WScript.Quit 0
End If

'================ 共分散（母分散） =========================
Public Function CovMatrix(data As Range) As Variant
    Dim n As Long, m As Long, i As Long, j As Long
    n = data.Rows.Count
    m = data.Columns.Count
    Dim arr As Variant: arr = data.Value
    Dim cov() As Double
    ReDim cov(1 To m, 1 To m)
    Dim avg_i As Double, avg_j As Double, s As Double, t As Long
    For i = 1 To m
        avg_i = Application.WorksheetFunction.Average(Application.Index(arr, 0, i))
        For j = 1 To m
            avg_j = Application.WorksheetFunction.Average(Application.Index(arr, 0, j))
            s = 0#
            For t = 1 To n
                s = s + (arr(t, i) - avg_i) * (arr(t, j) - avg_j)
            Next t
            cov(i, j) = s / n  '標本なら / (n-1)
        Next j
    Next i
    CovMatrix = cov
End Function

'================ 共通ヘルパ ===============================
Private Function Ensure2D(ByVal V As Variant) As Variant
    If TypeName(V) = "Range" Then
        Ensure2D = V.Value2
    ElseIf IsArray(V) Then
        Dim l1 As Long, u2 As Long
        On Error Resume Next
        l1 = LBound(V, 1): u2 = UBound(V, 2)
        If Err.Number <> 0 Then
            Err.Clear
            Dim L As Long, U As Long, i As Long
            L = LBound(V): U = UBound(V)
            Dim A() As Variant: ReDim A(1 To U - L + 1, 1 To 1)
            For i = L To U: A(i - L + 1, 1) = V(i): Next
            Ensure2D = A
        Else
            Ensure2D = V
        End If
        On Error GoTo 0
    Else
        Dim a1(1 To 1, 1 To 1) As Variant
        a1(1, 1) = V
        Ensure2D = a1
    End If
End Function

Private Function ToDoubleVectorV(col2D As Variant) As Variant
    Dim rL As Long, rU As Long, i As Long
    rL = LBound(col2D, 1): rU = UBound(col2D, 1)
    Dim V() As Double: ReDim V(1 To rU - rL + 1)
    For i = rL To rU
        If IsError(col2D(i, 1)) Or IsEmpty(col2D(i, 1)) Or Not IsNumeric(col2D(i, 1)) Then
            V(i - rL + 1) = 0#
        Else
            V(i - rL + 1) = CDbl(col2D(i, 1))
        End If
    Next
    ToDoubleVectorV = V
End Function

Private Function ToDoubleMatrixV(mat2D As Variant) As Variant
    Dim rL As Long, rU As Long, cL As Long, cU As Long, i As Long, j As Long
    rL = LBound(mat2D, 1): rU = UBound(mat2D, 1)
    cL = LBound(mat2D, 2): cU = UBound(mat2D, 2)
    Dim m() As Double: ReDim m(1 To rU - rL + 1, 1 To cU - cL + 1)
    For i = rL To rU
        For j = cL To cU
            If IsError(mat2D(i, j)) Or IsEmpty(mat2D(i, j)) Or Not IsNumeric(mat2D(i, j)) Then
                m(i - rL + 1, j - cL + 1) = 0#
            Else
                m(i - rL + 1, j - cL + 1) = CDbl(mat2D(i, j))
            End If
        Next j
    Next i
    ToDoubleMatrixV = m
End Function

Private Function MatVecV(m As Variant, V As Variant) As Variant
    Dim n As Long, i As Long, j As Long
    n = UBound(V)
    Dim res() As Double: ReDim res(1 To n)
    For i = 1 To n
        Dim s As Double: s = 0#
        For j = 1 To n
            s = s + m(i, j) * V(j)
        Next j
        res(i) = s
    Next i
    MatVecV = res
End Function

Private Function MaxDiagV(Mtx As Variant) As Double
    Dim n As Long, i As Long, maxVal As Double
    n = UBound(Mtx, 1)
    maxVal = Mtx(1, 1)
    For i = 2 To n
        If Mtx(i, i) > maxVal Then maxVal = Mtx(i, i)
    Next
    MaxDiagV = maxVal
End Function

Private Function VMax(A As Double, b As Double) As Double
    If A > b Then VMax = A Else VMax = b
End Function

Private Function ProjectCappedSimplexV(V As Variant, L As Variant, U As Variant) As Variant
    Dim n As Long: n = UBound(V)
    Dim w() As Double: ReDim w(1 To n)

    Dim lo As Double, hi As Double, mid As Double, s As Double
    Dim i As Long, z As Double
    lo = -1000000000000#: hi = 1000000000000#

    For i = 1 To n
        If V(i) - U(i) > lo Then lo = V(i) - U(i)
        If V(i) - L(i) < hi Then hi = V(i) - L(i)
    Next

    Dim it As Long
    For it = 1 To 60
        mid = 0.5 * (lo + hi)
        s = 0#
        For i = 1 To n
            z = V(i) - mid
            If z < L(i) Then
                z = L(i)
            ElseIf z > U(i) Then
                z = U(i)
            End If
            s = s + z
        Next
        If s > 1# Then
            lo = mid
        Else
            hi = mid
        End If
    Next

    For i = 1 To n
        z = V(i) - hi
        If z < L(i) Then
            z = L(i)
        ElseIf z > U(i) Then
            z = U(i)
        End If
        w(i) = z
    Next
    ProjectCappedSimplexV = w
End Function

Option Explicit

'=== コレスキー（下三角）分解: A=LL'。失敗時 Falseを返す ===
Private Function CholeskyDecomp(A As Variant, L As Variant) As Boolean
    Dim n As Long: n = UBound(A, 1)
    Dim i As Long, j As Long, k As Long
    Dim s As Double
    ReDim L(1 To n, 1 To n)
    On Error GoTo Fail
    For i = 1 To n
        For j = 1 To i
            s = 0#
            For k = 1 To j - 1
                s = s + L(i, k) * L(j, k)
            Next
            If i = j Then
                s = A(i, i) - s
                If s <= 0# Then CholeskyDecomp = False: Exit Function
                L(i, j) = Sqr(s)
            Else
                L(i, j) = (A(i, j) - s) / L(j, j)
            End If
        Next
    Next
    CholeskyDecomp = True
    Exit Function
Fail:
    CholeskyDecomp = False
End Function

'=== コレスキーで Ax=b を解く（前進・後退代入） ===
Private Function CholeskySolve(A As Variant, b As Variant) As Variant
    Dim n As Long: n = UBound(A, 1)
    Dim L As Variant, y() As Double, x() As Double
    Dim i As Long, k As Long, s As Double
    If Not CholeskyDecomp(A, L) Then Err.Raise 5, , "Cholesky失敗（半正定値ではない）"
    ReDim y(1 To n)
    ' 前進代入: L y = b
    For i = 1 To n
        s = b(i)
        For k = 1 To i - 1: s = s - L(i, k) * y(k): Next
        y(i) = s / L(i, i)
    Next
    ' 後退代入: L' x = y
    ReDim x(1 To n)
    For i = n To 1 Step -1
        s = y(i)
        For k = i + 1 To n: s = s - L(k, i) * x(k): Next
        x(i) = s / L(i, i)
    Next
    CholeskySolve = x
End Function

'=== {w | sum w = target, L<=w<=U} への射影（二分探索） ===
Private Sub ProjectBoxSimplexArr(w() As Double, L() As Double, U() As Double, ByVal target As Double)
    Dim n As Long: n = UBound(w)
    Dim i As Long, lo As Double, hi As Double, mid As Double, s As Double, z As Double
    lo = -1000000000000#: hi = 1000000000000#
    For i = 1 To n
        If w(i) - U(i) > lo Then lo = w(i) - U(i)
        If w(i) - L(i) < hi Then hi = w(i) - L(i)
    Next
    Dim it As Long
    For it = 1 To 60
        mid = 0.5 * (lo + hi)
        s = 0#
        For i = 1 To n
            z = w(i) - mid
            If z < L(i) Then
                z = L(i)
            ElseIf z > U(i) Then
                z = U(i)
            End If
            s = s + z
        Next
        If s > target Then lo = mid Else hi = mid
    Next
    For i = 1 To n
        z = w(i) - hi
        If z < L(i) Then
            z = L(i)
        ElseIf z > U(i) Then
            z = U(i)
        End If
        w(i) = z
    Next i
End Sub

'=== 厳密解（等式+上下限）: 逆行列/ワークシート関数 不使用／横ベクトル返し ===
' 使い方: =GMV_BOUNDED_EXACT(CovMatrix(OFFSET($X$2,0,0,125,6)), AN5:AN10, AM5:AM10)
Public Function GMV_BOUNDED_EXACT( _
    ByVal covInput As Variant, _
    ByVal L As Variant, _
    ByVal U As Variant, _
    Optional ByVal ridge As Double = 0.0000000001, _
    Optional ByVal tol As Double = 0.000000000001, _
    Optional ByVal maxIter As Long = 200 _
) As Variant
    On Error GoTo Fail

    '--- Σ 受取（Range/配列OK） ---
    Dim V As Variant
    If TypeName(covInput) = "Range" Then
        V = covInput.Value2
    Else
        V = covInput
    End If
    Dim n As Long, m As Long, i As Long, j As Long
    n = UBound(V, 1): m = UBound(V, 2)
    If n <> m Then Err.Raise 5, , "共分散は正方行列が必要です"

    Dim Sigma() As Double: ReDim Sigma(1 To n, 1 To n)
    For i = 1 To n
        For j = 1 To n
            Sigma(i, j) = CDbl(V(i, j))
        Next
    Next
    If ridge > 0# Then For i = 1 To n: Sigma(i, i) = Sigma(i, i) + ridge: Next

    '--- L/U 受取（Range/配列OK, 縦ベクトル想定） ---
    Dim LV As Variant, UV As Variant
    LV = IIf(TypeName(L) = "Range", L.Value2, L)
    UV = IIf(TypeName(U) = "Range", U.Value2, U)
    Dim Lb() As Double, Ub() As Double
    ReDim Lb(1 To n): ReDim Ub(1 To n)
    For i = 1 To n
        Lb(i) = CDbl(LV(i, 1))
        Ub(i) = CDbl(UV(i, 1))
    Next

    '--- 可行性チェック ---
    Dim sumL As Double, sumU As Double
    For i = 1 To n: sumL = sumL + Lb(i): sumU = sumU + Ub(i): Next
    If sumL > 1# + 0.000000000001 Or sumU < 1# - 0.000000000001 Then Err.Raise 5, , "不可行: SUM(L)?1?SUM(U)"

    '--- 初期点: 均等→射影 ---
    Dim w() As Double: ReDim w(1 To n)
    For i = 1 To n: w(i) = 1# / n: Next
    ProjectBoxSimplexArr w, Lb, Ub, 1#

    '--- アクティブセット ---
    Dim isB() As Boolean: ReDim isB(1 To n)
    For i = 1 To n
        If Abs(w(i) - Lb(i)) < 10 * tol Or Abs(w(i) - Ub(i)) < 10 * tol Then isB(i) = True
    Next

    Dim iter As Long
    For iter = 1 To maxIter
        Dim sumFixed As Double: sumFixed = 0#
        Dim cntF As Long: cntF = 0
        For i = 1 To n
            If isB(i) Then sumFixed = sumFixed + w(i) Else cntF = cntF + 1
        Next
        If cntF = 0 Then Exit For
        Dim targetSum As Double: targetSum = 1# - sumFixed

        ' 自由集合インデックス
        Dim F() As Long, idx As Long
        ReDim F(1 To cntF): idx = 0
        For i = 1 To n
            If Not isB(i) Then idx = idx + 1: F(idx) = i
        Next

        ' FF と 1_F を用意
        Dim FF() As Double: ReDim FF(1 To cntF, 1 To cntF)
        Dim oneF() As Double: ReDim oneF(1 To cntF)
        For i = 1 To cntF
            oneF(i) = 1#
            For j = 1 To cntF
                FF(i, j) = Sigma(F(i), F(j))
            Next
        Next

        ' y = FF^{-1} * 1_F（コレスキーで直接解く）
        Dim y As Variant: y = CholeskySolve(FF, oneF)

        ' α = target / (1_F' y)
        Dim den As Double: den = 0#
        For i = 1 To cntF: den = den + oneF(i) * y(i): Next
        If Abs(den) < 1E-18 Then Err.Raise 5, , "特異行列（ridge を上げてください）"
        Dim alpha As Double: alpha = targetSum / den

        ' w_F = α y
        For i = 1 To cntF
            w(F(i)) = alpha * y(i)
        Next

        ' 境界処理
        Dim changed As Boolean: changed = False
        For i = 1 To cntF
            Dim k As Long: k = F(i)
            If w(k) < Lb(k) - tol Then w(k) = Lb(k): isB(k) = True: changed = True
            If w(k) > Ub(k) + tol Then w(k) = Ub(k): isB(k) = True: changed = True
        Next
        If changed Then GoTo NextIter

        ' KKTチェック
        Dim Sw() As Double: ReDim Sw(1 To n)
        Dim acc As Double
        For i = 1 To n
            acc = 0#
            For j = 1 To n: acc = acc + Sigma(i, j) * w(j): Next
            Sw(i) = acc
        Next
        Dim nu As Double, cnt As Long: nu = 0#: cnt = 0
        For i = 1 To n: If Not isB(i) Then nu = nu + 2# * Sw(i): cnt = cnt + 1
        Next
        If cnt > 0 Then nu = nu / cnt Else nu = 2# * Sw(1)

        Dim violated As Long: violated = 0
        For i = 1 To n
            If isB(i) Then
                Dim gi As Double: gi = 2# * Sw(i) - nu
                If Abs(w(i) - Lb(i)) < 10 * tol Then
                    If gi < -0.0000000001 Then isB(i) = False: violated = violated + 1
                ElseIf Abs(w(i) - Ub(i)) < 10 * tol Then
                    If gi > 0.0000000001 Then isB(i) = False: violated = violated + 1
                End If
            End If
        Next
        If violated = 0 Then Exit For
NextIter:
    Next

    ' 合計=1 に微調整
    Dim sumW As Double: sumW = 0#
    For i = 1 To n: sumW = sumW + w(i): Next
    Dim delta As Double: delta = 1# - sumW
    For i = 1 To n
        If w(i) > Lb(i) + 10 * tol And w(i) < Ub(i) - 10 * tol Then
            w(i) = w(i) + delta
            Exit For
        End If
    Next

    ' 横ベクトル返し
    Dim out() As Variant: ReDim out(1 To 1, 1 To n)
    For i = 1 To n: out(1, i) = w(i): Next
    GMV_BOUNDED_EXACT = out
    Exit Function

Fail:
    GMV_BOUNDED_EXACT = CVErr(xlErrValue)
End Function

Sub RunSolverStable()

    ' 再現性のためにマルチスレッド停止
    Application.MultiThreadedCalculation.Enabled = False

    ' 強制再計算（順序を統一）
    Application.CalculateFullRebuild

    ' 初期値を強制設定
    Range("K4:P4").Value = 1 / 6

    SolverReset
    SolverOk SetCell:="$K$36", MaxMinVal:=2, _
        ByChange:="$K$4:$P$4"

    ' 制約
    SolverAdd CellRef:="$K$4:$P$4", Relation:=3, FormulaText:=1
    SolverAdd CellRef:="$K$4:$P$4", Relation:=1, FormulaText:="0"

    ' Solver オプションを明示指定
    SolverOptions Precision:=1E-12, Convergence:=1E-12, _
        MaxTime:=999, MaxIterations:=2000, _
        Scaling:=True, AssumeLinear:=False, StepThru:=False

    SolverSolve UserFinish:=True

    ' マルチスレッドを元に戻す
    Application.MultiThreadedCalculation.Enabled = True

End Sub
